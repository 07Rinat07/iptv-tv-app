name: Apply Player Home Guard Patch

on:
  pull_request:
    paths:
      - '.github/workflows/apply-player-home-guard.yml'

permissions:
  contents: write

jobs:
  apply-guard-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/player-home-dashboard-guard'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic guard extension
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='e9dd6a654ee1e37204e0762f011f7589582f26da'
          actual_blob="$(git rev-parse HEAD:.github/workflows/player-refactor-guard.yml)"
          test "$actual_blob" = "$expected_blob"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/player-refactor-guard.yml')
          text = path.read_text()

          replacements = [
              (
                  "      - 'feature/player/**'\n",
                  "      - 'feature/player/**'\n      - 'feature/home/**'\n",
              ),
              (
                  '                      "feature/player/src/main/",\n                      "core/player/src/main/",\n',
                  '                      "feature/player/src/main/",\n                      "feature/home/src/main/",\n                      "core/player/src/main/",\n',
              ),
              (
                  'print("No Player-owned production/routing/settings behavior changed; boundary is not applicable.")',
                  'print("No Player/dashboard-owned production/routing/settings behavior changed; boundary is not applicable.")',
              ),
              (
                  '      - name: Player and Scanner regression tests\n',
                  '      - name: Home, Player and Scanner regression tests\n',
              ),
              (
                  '          ./gradlew \\\n            :feature:player:testDebugUnitTest \\\n',
                  '          ./gradlew \\\n            :feature:home:testDebugUnitTest \\\n            :feature:player:testDebugUnitTest \\\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one guarded replacement, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- .github/workflows/player-refactor-guard.yml

      - name: Commit focused workflow change
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/apply-player-home-guard.yml
          git add -- .github/workflows/player-refactor-guard.yml
          git commit -m 'ci(player): guard Home dashboard changes'
          git push origin "HEAD:${HEAD_BRANCH}"
