name: Apply V4a telemetry patch

on:
  push:
    branches:
      - agent/ace-live-player-boundary-telemetry-v4a
    paths:
      - '.v4a-patch/**'
      - '.github/workflows/v4a-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: trigger V4a patch apply' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified V4a patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v4a-patch/part-*.patch > /tmp/v4a.patch
          echo '2f6e6116484b5e20c7620a5cf23b4cebb61f2099b712a4b43877aef08c09d7ed  /tmp/v4a.patch' | sha256sum -c -
          patch -p1 --dry-run < /tmp/v4a.patch
          patch -p1 < /tmp/v4a.patch
          python -m unittest tools.tests.test_playback_latency
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Commit V4a implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/p2p/src/main/java/com/iptv/tv/core/p2p/AceLiveEmbeddedEngine.kt \
            core/p2p/src/main/java/com/iptv/tv/core/p2p/AceLiveMediaOutput.kt \
            core/p2p/src/test/java/com/iptv/tv/core/p2p/LoopbackHttpLiveServerLifecycleTest.kt \
            docs/ACE_LIVE_ADAPTIVE_STREAMING_CORE.md \
            docs/P2P_RUNTIME_NOTES.md \
            docs/ROADMAP.md \
            feature/player/src/main/java/com/iptv/tv/feature/player/P2pPlayerBoundaryTelemetry.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerVideoSurface.kt \
            feature/player/src/test/java/com/iptv/tv/feature/player/P2pPlayerBoundaryTelemetryTest.kt \
            tools/playback_latency.py \
            tools/analyze_playback_latency.py \
            tools/tests/test_playback_latency.py
          git diff --cached --check
          git commit -m 'feat(player): add P2P loopback boundary telemetry'
          git push origin HEAD:${GITHUB_REF_NAME}
