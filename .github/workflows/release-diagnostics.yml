name: Release diagnostics

on:
  pull_request:

concurrency:
  group: release-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Assemble release with diagnostics
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info assembleRelease 2>&1 | tee assemble-release.log

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            assemble-release.log
            **/build/outputs/mapping/**
