name: EPG player catch-up action patch r1

on:
  push:
    branches:
      - feat/epg-player-catchup-action-r1
    paths:
      - .github/workflows/epg-player-catchup-action-patch-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epg-player-catchup-action-r1
          fetch-depth: 0

      - name: Apply exact catch-up action wiring patch
        run: |
          python .github/scripts/epg_player_catchup_action_patch_r1.py
          git diff --check
          git diff -- feature/player/src/main/java/com/iptv/tv/feature/player/StableProgrammeDialog.kt
          git diff -- feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerShell.kt
          git diff -- feature/player/src/main/java/com/iptv/tv/feature/player/StableResponsiveCompactPlayer.kt
          git diff -- feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt
          git diff -- feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt

      - name: Commit catch-up action wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            feature/player/src/main/java/com/iptv/tv/feature/player/StableProgrammeDialog.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerShell.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StableResponsiveCompactPlayer.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt
          git commit -m "feat(epg): wire fail-closed archive playback action"
          git push origin HEAD:feat/epg-player-catchup-action-r1

# retry: exact responsive indentation handled separately
