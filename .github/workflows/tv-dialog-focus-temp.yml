name: Temporary TV dialog focus patch

on:
  push:
    branches:
      - feat/tv-navigation-audit-next

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tv-navigation-audit-next
          fetch-depth: 0
      - name: Patch dialog focus behavior and tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/iptv/tv/MainActivity.kt')
          s = main.read_text(encoding='utf-8')
          s = s.replace(
              'import com.iptv.tv.core.designsystem.theme.IptvTheme\n',
              'import com.iptv.tv.core.designsystem.theme.IptvTheme\nimport com.iptv.tv.core.designsystem.theme.tvFocusOutline\n',
              1
          )
          s = s.replace(
              '                                onExit = { showExitConfirm = true },\n                                onSections = { showSectionsMenu = true }\n',
              '                                onExit = { showExitConfirm = true },\n                                onSections = { showSectionsMenu = true },\n                                sectionsMenuVisible = showSectionsMenu\n',
              1
          )
          old_exit = '''            if (showExitConfirm) {
                AlertDialog(
                    onDismissRequest = { showExitConfirm = false },
                    title = { Text("Выход из приложения") },
                    text = { Text("Закрыть приложение?") },
                    confirmButton = {
                        Button(onClick = { activity?.finish() }) {
                            Text("Да, закрыть")
                        }
                    },
                    dismissButton = {
                        Button(onClick = { showExitConfirm = false }) {
                            Text("Отмена")
                        }
                    }
                )
            }
'''
          new_exit = '''            if (showExitConfirm) {
                val exitCancelFocusRequester = remember { FocusRequester() }
                LaunchedEffect(Unit) {
                    exitCancelFocusRequester.requestFocus()
                }
                AlertDialog(
                    onDismissRequest = { showExitConfirm = false },
                    title = { Text("Выход из приложения") },
                    text = { Text("Закрыть приложение?") },
                    confirmButton = {
                        Button(
                            onClick = { activity?.finish() },
                            modifier = Modifier.tvFocusOutline()
                        ) {
                            Text("Да, закрыть")
                        }
                    },
                    dismissButton = {
                        Button(
                            onClick = { showExitConfirm = false },
                            modifier = Modifier
                                .focusRequester(exitCancelFocusRequester)
                                .tvFocusOutline()
                        ) {
                            Text("Отмена")
                        }
                    }
                )
            }
'''
          if old_exit not in s:
              raise SystemExit('exit dialog block not found')
          s = s.replace(old_exit, new_exit, 1)
          s = s.replace(
              '''private fun NavControlButtons(
    onBack: () -> Unit,
    onExit: () -> Unit,
    onSections: () -> Unit
) {
    val sectionsFocusRequester = remember { FocusRequester() }
    LaunchedEffect(Unit) {
        sectionsFocusRequester.requestFocus()
    }
''',
              '''private fun NavControlButtons(
    onBack: () -> Unit,
    onExit: () -> Unit,
    onSections: () -> Unit,
    sectionsMenuVisible: Boolean
) {
    val sectionsFocusRequester = remember { FocusRequester() }
    LaunchedEffect(sectionsMenuVisible) {
        if (!sectionsMenuVisible) {
            sectionsFocusRequester.requestFocus()
        }
    }
''',
              1
          )
          routes_marker = '''        Routes.ABOUT to "О приложении"
    )

    AlertDialog(
'''
          routes_repl = '''        Routes.ABOUT to "О приложении"
    )
    val firstSelectableIndex = routes.indexOfFirst { (route, _) -> route != currentRoute }
    val firstSelectableFocusRequester = remember { FocusRequester() }
    LaunchedEffect(currentRoute) {
        firstSelectableFocusRequester.requestFocus()
    }

    AlertDialog(
'''
          if routes_marker not in s:
              raise SystemExit('sections routes marker not found')
          s = s.replace(routes_marker, routes_repl, 1)
          old_button_modifier = '''                            modifier = Modifier
                                .fillMaxWidth()
                                .testTag(navButtonTag(route))
'''
          new_button_modifier = '''                            modifier = Modifier
                                .fillMaxWidth()
                                .then(
                                    if (index == firstSelectableIndex) {
                                        Modifier.focusRequester(firstSelectableFocusRequester)
                                    } else {
                                        Modifier
                                    }
                                )
                                .testTag(navButtonTag(route))
                                .tvFocusOutline()
'''
          if old_button_modifier not in s:
              raise SystemExit('sections button modifier not found')
          s = s.replace(old_button_modifier, new_button_modifier, 1)
          s = s.replace(
              '            OutlinedButton(onClick = onDismiss) { Text("Закрыть") }\n',
              '            OutlinedButton(onClick = onDismiss, modifier = Modifier.tvFocusOutline()) { Text("Закрыть") }\n',
              1
          )
          main.write_text(s, encoding='utf-8')

          test = Path('app/src/androidTest/java/com/iptv/tv/AppSmokeTest.kt')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              'import androidx.compose.ui.test.assertTextContains\n',
              'import androidx.compose.ui.test.assertIsFocused\nimport androidx.compose.ui.test.assertTextContains\n',
              1
          )
          test_marker = '''    @Test
    fun importTextAndOpenPlayerRouteSmoke() {
'''
          test_insert = '''    @Test
    fun sectionsDialogStartsFocusedAndRestoresSectionsButton() {
        unlockApp()
        composeRule.onNodeWithTag(TAG_SECTIONS_BUTTON).performClick()
        composeRule.onNodeWithTag(navButtonTag(Routes.SCANNER)).assertIsFocused()
        composeRule.onNodeWithTag(navButtonTag(Routes.SCANNER)).performClick()
        assertRoute("scanner")
        composeRule.onNodeWithTag(TAG_SECTIONS_BUTTON).assertIsFocused()
    }

    @Test
    fun importTextAndOpenPlayerRouteSmoke() {
'''
          if test_marker not in t:
              raise SystemExit('smoke test marker not found')
          t = t.replace(test_marker, test_insert, 1)
          test.write_text(t, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace(
              '- управление D-pad, пультом, мышью, тачпадом и сенсорным экраном;\n',
              '- управление D-pad, пультом, мышью, тачпадом и сенсорным экраном; меню «Разделы» получает явный стартовый TV-focus и возвращает его на кнопку открытия после перехода/закрытия;\n',
              1
          )
          readme.write_text(r, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          m = roadmap.read_text(encoding='utf-8')
          m = m.replace(
              '- Editor использует общий `TvScrollableLazyColumn`: TV-кнопки начала/Page Up/Page Down, PageUp/PageDown и ChannelUp/ChannelDown, mouse wheel/touchpad и scrollbar без изменения операций редактирования;\n',
              '- Editor использует общий `TvScrollableLazyColumn`: TV-кнопки начала/Page Up/Page Down, PageUp/PageDown и ChannelUp/ChannelDown, mouse wheel/touchpad и scrollbar без изменения операций редактирования;\n- меню «Разделы» при открытии фокусирует первый доступный маршрут, удерживает TV-focus видимым и возвращает фокус на кнопку «Разделы» после закрытия/перехода; диалог выхода по умолчанию фокусирует безопасную «Отмена»;\n',
              1
          )
          roadmap.write_text(m, encoding='utf-8')
          PY
          rm .github/workflows/tv-dialog-focus-temp.yml
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add app/src/main/java/com/iptv/tv/MainActivity.kt app/src/androidTest/java/com/iptv/tv/AppSmokeTest.kt README.md docs/ROADMAP.md .github/workflows/tv-dialog-focus-temp.yml
          git diff --cached --check
          git commit -m "feat(tv): stabilize sections and exit dialog focus"
          git push origin HEAD:feat/tv-navigation-audit-next
