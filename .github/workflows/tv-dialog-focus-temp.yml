name: Temporary TV dialog focus patch

on:
  push:
    branches:
      - feat/tv-navigation-audit-next

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tv-navigation-audit-next
          fetch-depth: 0
      - name: Apply patch
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          rm .github/workflows/tv-dialog-focus-temp.yml
      - name: Commit patch
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add app/src/main/java/com/iptv/tv/MainActivity.kt app/src/androidTest/java/com/iptv/tv/AppSmokeTest.kt README.md docs/ROADMAP.md .github/workflows/tv-dialog-focus-temp.yml
          git diff --cached --check
          git commit -m "feat(tv): stabilize sections and exit dialog focus"
          git push origin HEAD:feat/tv-navigation-audit-next
