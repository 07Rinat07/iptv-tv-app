name: Temporary Scanner TV navigation patch

on:
  push:
    branches:
      - feat/scanner-tv-navigation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-nav-applied]') && !contains(github.event.head_commit.message, 'remove temporary Scanner workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scanner-tv-navigation
          fetch-depth: 0
      - name: Apply minimal Scanner scroll integration and docs
        shell: python
        run: |
          from pathlib import Path

          scanner = Path('feature/scanner/src/main/java/com/iptv/tv/feature/scanner/ScannerScreen.kt')
          text = scanner.read_text(encoding='utf-8')
          old_import = 'import androidx.compose.foundation.lazy.LazyColumn\n'
          anchor = 'import androidx.hilt.navigation.compose.hiltViewModel\n'
          shared_import = 'import com.iptv.tv.core.designsystem.components.TvScrollableLazyColumn\n'
          assert old_import in text, 'raw LazyColumn import not found'
          assert anchor in text, 'Hilt import anchor not found'
          assert shared_import not in text, 'shared TV scroll import already present'
          assert text.count('LazyColumn(') == 1, 'unexpected LazyColumn count'
          text = text.replace(old_import, '', 1)
          text = text.replace(anchor, anchor + shared_import, 1)
          text = text.replace('        LazyColumn(\n', '        TvScrollableLazyColumn(\n', 1)
          scanner.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          anchor = '- управление D-pad, пультом, мышью, тачпадом и сенсорным экраном;\n'
          addition = '- длинный экран Scanner использует общие TV-кнопки постраничной прокрутки и поддерживает PageUp/PageDown/ChannelUp/ChannelDown без изменения поискового алгоритма;\n'
          assert anchor in text, 'README navigation anchor not found'
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)
          readme.write_text(text, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '''## Блокирующий этап 3: удобство сканера без изменения алгоритма поиска

1. Не менять `ScannerViewModel`, провайдеры и поисковую логику без отдельной причины.
2. Добавить быстрый Page Up/Page Down и прокрутку крупными шагами в `ScannerScreen`.
3. Добавить корректную обработку колеса оптической мыши и D-pad по аналогии с другими длинными экранами.
4. Проверить сохранение фокуса после прокрутки и возврата из предпросмотра.
'''
          new = '''## Блокирующий этап 3: удобство сканера без изменения алгоритма поиска

1. Не менять `ScannerViewModel`, провайдеры и поисковую логику без отдельной причины.
2. `ScannerScreen` перевести на общий `TvScrollableLazyColumn`: видимые кнопки в начало/Page Up/Page Down, аппаратные PageUp/PageDown и ChannelUp/ChannelDown.
3. Сохранить штатную прокрутку колесом мыши/тачпадом и scrollbar drag без изменения query/provider/search/import semantics.
4. После интеграции проверить сохранение фокуса после прокрутки и возврата из предпросмотра; это остаётся следующим отдельным UX-инкрементом.
'''
          assert old in text, 'ROADMAP Scanner block not found'
          text = text.replace(old, new, 1)
          roadmap.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/scanner/src/main/java/com/iptv/tv/feature/scanner/ScannerScreen.kt README.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m "feat(scanner): add TV list navigation [scanner-nav-applied]"
          git push origin HEAD:feat/scanner-tv-navigation
