          # Ace Stream

          Приложение распознаёт `acestream://`, `ace://`, Content ID, magnet, `.torrent`, `.acelive` и локальные Engine URL.

          Интеграция использует официальный Android Service/AIDL контракт:

          1. обнаружение установленного Ace Stream Media/Engine;
          2. `bindService`;
          3. запуск и ожидание готовности движка;
          4. получение локального HTTP endpoint;
          5. передача разрешённого потока в основной плеер.

          Если движок отсутствует или не отвечает, пользователь получает диагностируемую ошибку без бесконечного цикла повторов.
          ''')

          write("docs/testing/device-acceptance.md", r'''
          # Приёмка на TV Box

          ## Матрица

          - Android 7/API 24, Android 9/10 и Android 12+;
          - 2 ГБ и 4 ГБ RAM;
          - D-pad, оптическая мышь, тачпад;
          - стабильная и ограниченная сеть.

          ## Обязательные сценарии

          1. Запуск → готовый список → импорт → выбор канала → воспроизведение.
          2. Сохранённый список → прямой переход в плеер.
          3. Сканер → импорт → редактор → плеер.
          4. Переключение каналов и полноэкранного режима всеми типами ввода.
          5. Media3 → LibVLC fallback на проблемном потоке.
          6. Ace Stream через установленный Android Engine.
          7. Сброс логов → повтор ошибки → экспорт нового журнала.

          ## Длительные тесты

          - быстрый этап: не менее 2 часов непрерывного HLS;
          - релизный этап: 8 часов, смена канала каждые 3–5 минут;
          - критерии: без crash/ANR, память стабилизируется, восстановление не зацикливается.

          ## Слабая сеть

          - 2–5 Мбит/с;
          - 120–250 мс задержки;
          - 1–3% потери пакетов.
          ''')

