name: Apply startup player and repository cleanup

on:
  push:
    branches:
      - feat/startup-player-diagnostics-cleanup

permissions:
  contents: write

concurrency:
  group: startup-player-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source and repository cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import textwrap

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip("\n"), encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Required fragment not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # --- Startup screen: player-first flow with saved and built-in playlists. ---
          write("feature/home/build.gradle.kts", r'''
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.hilt)
              alias(libs.plugins.kotlin.kapt)
          }

          android {
              namespace = "com.iptv.tv.feature.home"
              compileSdk = 35

              defaultConfig {
                  minSdk = 24
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = libs.versions.composeCompiler.get()
              }
          }

          dependencies {
              implementation(project(":core:common"))
              implementation(project(":core:designsystem"))
              implementation(project(":core:domain"))
              implementation(project(":core:model"))

              implementation(libs.androidx.core.ktx)
              implementation(libs.kotlinx.coroutines.android)
              implementation(libs.androidx.lifecycle.viewmodel.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.lifecycle.runtime.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.foundation)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.compose.material3)

              implementation(libs.hilt.android)
              kapt(libs.hilt.compiler)
              implementation(libs.androidx.hilt.navigation.compose)

              debugImplementation(libs.androidx.compose.ui.tooling)
              testImplementation(libs.junit4)
          }

          kapt {
              correctErrorTypes = true
          }
          ''')

          write("feature/home/src/main/java/com/iptv/tv/feature/home/HomeStartupPolicy.kt", r'''
          package com.iptv.tv.feature.home

          import com.iptv.tv.core.model.Playlist

          internal fun findImportedReadyPlaylist(
              playlists: List<Playlist>,
              sourceUrl: String
          ): Playlist? = playlists.firstOrNull { playlist ->
              playlist.source.trim() == sourceUrl.trim()
          }
          ''')

          write("feature/home/src/main/java/com/iptv/tv/feature/home/HomeViewModel.kt", r'''
          package com.iptv.tv.feature.home

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.iptv.tv.core.common.AppResult
          import com.iptv.tv.core.domain.repository.PlaylistRepository
          import com.iptv.tv.core.model.Playlist
          import dagger.hilt.android.lifecycle.HiltViewModel
          import javax.inject.Inject
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch

          data class HomeUiState(
              val title: String = "Смотреть ТВ",
              val description: String = "Выберите сохранённый или готовый список каналов — после загрузки сразу откроется плеер.",
              val playlists: List<Playlist> = emptyList(),
              val isImporting: Boolean = false,
              val importingUrl: String? = null,
              val lastError: String? = null,
              val lastInfo: String? = null,
              val pendingOpenPlaylistId: Long? = null
          )

          @HiltViewModel
          class HomeViewModel @Inject constructor(
              private val playlistRepository: PlaylistRepository
          ) : ViewModel() {
              private val _uiState = MutableStateFlow(HomeUiState())
              val uiState: StateFlow<HomeUiState> = _uiState.asStateFlow()

              init {
                  viewModelScope.launch {
                      playlistRepository.observePlaylists().collect { playlists ->
                          _uiState.update { state -> state.copy(playlists = playlists) }
                      }
                  }
              }

              fun watchReadyPlaylist(preset: ReadyPlaylistPreset) {
                  val existing = findImportedReadyPlaylist(
                      playlists = _uiState.value.playlists,
                      sourceUrl = preset.url
                  )
                  if (existing != null) {
                      requestOpenPlaylist(existing.id, "Открывается сохранённый список: ${existing.name}")
                      return
                  }
                  if (_uiState.value.isImporting) return

                  viewModelScope.launch {
                      _uiState.update {
                          it.copy(
                              isImporting = true,
                              importingUrl = preset.url,
                              lastError = null,
                              lastInfo = "Загрузка списка «${preset.name}»…"
                          )
                      }
                      when (val result = playlistRepository.importFromUrl(preset.url, preset.name)) {
                          is AppResult.Success -> {
                              _uiState.update {
                                  it.copy(
                                      isImporting = false,
                                      importingUrl = null,
                                      lastInfo = "Список добавлен. Открывается плеер.",
                                      pendingOpenPlaylistId = result.data.playlistId
                                  )
                              }
                          }
                          is AppResult.Error -> {
                              _uiState.update {
                                  it.copy(
                                      isImporting = false,
                                      importingUrl = null,
                                      lastError = "Не удалось загрузить «${preset.name}»: ${result.message}",
                                      lastInfo = null
                                  )
                              }
                          }
                          AppResult.Loading -> {
                              _uiState.update { it.copy(isImporting = false, importingUrl = null) }
                          }
                      }
                  }
              }

              fun requestOpenPlaylist(playlistId: Long, message: String? = null) {
                  _uiState.update {
                      it.copy(
                          pendingOpenPlaylistId = playlistId,
                          lastInfo = message,
                          lastError = null
                      )
                  }
              }

              fun consumeOpenPlaylistRequest() {
                  _uiState.update { it.copy(pendingOpenPlaylistId = null) }
              }
          }
          ''')

          write("feature/home/src/main/java/com/iptv/tv/feature/home/HomeScreen.kt", r'''
