          - Crash/ANR:
          - Итог: PASS / FAIL
          - Примечания:
          ''')

          write("docs/development/ai-tools.md", r'''
          # Инструменты индексации

          Каталог `tools/ai` используется для офлайн-подготовки индекса публичных плейлистов. Результат можно импортировать в диагностику как JSONL, отфильтровать по HTTP-статусу и числу `EXTINF`, затем вручную добавить выбранный URL.

          Эти инструменты не заменяют встроенный сканер и не должны автоматически публиковать или импортировать непроверенные источники.
          ''')

          write("docs/archive/development-stages.md", r'''
          # Архив этапов

          Ранее проект документировался отдельными файлами `stage1`–`stage11`, `hotfix*` и отчётами отдельных веток. После завершения интеграции их актуальное содержание объединено в тематические документы.

          Краткая последовательность:

          1. архитектура и базовые модели;
