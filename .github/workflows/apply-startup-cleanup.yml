              @Test
              fun findsPreviouslyImportedReadyPlaylistByExactSource() {
                  val playlists = listOf(
                      playlist(id = 7L, source = "https://example.org/one.m3u"),
                      playlist(id = 9L, source = "https://example.org/two.m3u")
                  )

