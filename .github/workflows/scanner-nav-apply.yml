name: Apply Scanner navigation patch

on:
  push:
    branches: [feat/scanner-tv-navigation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/scanner-tv-navigation
          fetch-depth: 0
      - name: Apply Scanner TV scroll integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('feature/scanner/src/main/java/com/iptv/tv/feature/scanner/ScannerScreen.kt')
          s = p.read_text(encoding='utf-8')
          shared = 'import com.iptv.tv.core.designsystem.components.TvScrollableLazyColumn\n'
          if shared not in s:
              assert 'import androidx.compose.foundation.lazy.LazyColumn\n' in s
              assert 'import androidx.hilt.navigation.compose.hiltViewModel\n' in s
              assert s.count('LazyColumn(') == 1
              s = s.replace('import androidx.compose.foundation.lazy.LazyColumn\n', '', 1)
              s = s.replace('import androidx.hilt.navigation.compose.hiltViewModel\n', 'import androidx.hilt.navigation.compose.hiltViewModel\n' + shared, 1)
              s = s.replace('        LazyColumn(\n', '        TvScrollableLazyColumn(\n', 1)
              p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          anchor = '- управление D-pad, пультом, мышью, тачпадом и сенсорным экраном;\n'
          line = '- Scanner: видимые TV-кнопки постраничной прокрутки, PageUp/PageDown и ChannelUp/ChannelDown без изменения алгоритма поиска;\n'
          assert anchor in s
          if line not in s:
              s = s.replace(anchor, anchor + line, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('docs/ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          old = '2. Добавить быстрый Page Up/Page Down и прокрутку крупными шагами в `ScannerScreen`.\n3. Добавить корректную обработку колеса оптической мыши и D-pad по аналогии с другими длинными экранами.\n4. Проверить сохранение фокуса после прокрутки и возврата из предпросмотра.\n'
          new = '2. `ScannerScreen` использует общий `TvScrollableLazyColumn`: видимые кнопки в начало/Page Up/Page Down и аппаратные PageUp/PageDown/ChannelUp/ChannelDown.\n3. Штатную прокрутку колесом мыши/тачпадом и scrollbar drag сохранить без изменения query/provider/search/import semantics.\n4. Следующим отдельным UX-инкрементом проверить сохранение видимого фокуса после прокрутки и возврата из предпросмотра.\n'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise RuntimeError('Scanner roadmap block not found')
          PY
      - name: Commit changes
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/scanner/src/main/java/com/iptv/tv/feature/scanner/ScannerScreen.kt README.md docs/ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "feat(scanner): use shared TV scroll navigation"
          git push origin HEAD:feat/scanner-tv-navigation
