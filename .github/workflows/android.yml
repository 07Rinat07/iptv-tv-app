name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - build/**

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_AVD_HOME: /tmp/android-avd
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Torrent TV playback changes
        id: torrent-tv-smoke
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          printf '%s\n' "$changed_files"

          run_smoke=false
          if grep -Eq \
            '^(app/src/androidTest/java/com/iptv/tv/(TorrentTvPlaybackSmokeTest|HiltTestRunner)\.kt|app/src/main/java/com/iptv/tv/ApplicationEngineEntryPoint\.kt|core/(p2p|engine)/|core/data/src/main/java/com/iptv/tv/core/data/repository/(HybridEngineRepositoryImpl|CoalescingEngineRepository)\.kt)' \
            <<< "$changed_files"; then
            run_smoke=true
          elif git diff --unified=0 "$base_sha" "$head_sha" -- \
            core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt \
            core/data/src/main/java/com/iptv/tv/core/data/di/RepositoryModule.kt \
            | grep -Eq '^[+-][^+-].*(resolveTorrentStream|stopTorrentStream|prepareStream|torrent|Torrent|P2P|p2p|Ace|acestream|infohash|contentId|EngineRepository|engineRepository|DHT|dht|peer)'; then
            run_smoke=true
          fi

          echo "run=$run_smoke" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK directory
        run: |
          mkdir -p "$ANDROID_SDK_ROOT" "$ANDROID_AVD_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Java toolchain
        run: |
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          javac -version
          "$JAVA_HOME/bin/jlink" --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_AVD_HOME"
          command -v sdkmanager
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API_LEVEL}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Write local.properties
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Ensure Gradle executable
        run: chmod +x ./gradlew

      - name: Compile Android instrumentation tests
        if: steps.torrent-tv-smoke.outputs.run == 'true'
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Install emulator image for Torrent TV playback smoke
        if: steps.torrent-tv-smoke.outputs.run == 'true'
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "emulator" \
            "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"

      - name: Run real Torrent TV playback smoke without Ace Engine
        id: torrent-tv-playback-smoke
        if: steps.torrent-tv-smoke.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" build-artifacts/torrent-tv-smoke
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"

          echo "no" | avdmanager create avd \
            --force \
            --name iptv-ci \
            --package "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"

          echo "Created AVDs:"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/iptv-ci.ini"

          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd iptv-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-metrics \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!

          if ! timeout 45 adb wait-for-device; then
            echo "Emulator did not expose ADB within 45 seconds"
            tail -n 160 emulator.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          if ! timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            echo "Emulator did not complete boot within 240 seconds"
            tail -n 160 emulator.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true
          echo "Emulator ABI: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"

          if adb shell pm list packages | grep -qi 'acestream'; then
            echo "Unexpected Ace Stream package found on clean emulator"
            adb shell pm list packages | grep -i 'acestream' || true
            exit 1
          fi
          echo "No external Ace Stream package is installed. Running app-owned P2P smoke."

          # Keep the full instrumentation stdout/stderr even when Gradle/test fails.
          # pipefail preserves the original Gradle exit status through tee.
          adb logcat -c || true
          ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.iptv.tv.TorrentTvPlaybackSmokeTest \
            2>&1 | tee build-artifacts/torrent-tv-smoke/instrumentation-output.log

      - name: Print Torrent TV emulator diagnostics
        if: always() && steps.torrent-tv-smoke.outputs.run == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          mkdir -p build-artifacts/torrent-tv-smoke

          # A failed/half-started emulator can leave adb indefinitely waiting.
          # Keep diagnostics best-effort and bounded so deterministic checks still run.
          timeout 20s adb logcat -d -v threadtime \
            > build-artifacts/torrent-tv-smoke/adb-logcat.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity top \
            > build-artifacts/torrent-tv-smoke/activity-top.txt 2>&1 || true

          # Preserve the Android instrumentation reports/results in a stable
          # diagnostics directory in addition to the existing report globs.
          find app/build -type f \
            \( -path '*/outputs/androidTest-results/*' -o -path '*/reports/androidTests/*' \) \
            -print0 2>/dev/null \
            | xargs -0 -r cp --parents -t build-artifacts/torrent-tv-smoke/ || true
          find app/build -type f \
            \( -path '*/outputs/androidTest-results/*' -o -path '*/reports/androidTests/*' \) \
            -print 2>/dev/null \
            > build-artifacts/torrent-tv-smoke/android-test-files.txt || true

          echo "::group::Instrumentation output tail"
          if [ -f build-artifacts/torrent-tv-smoke/instrumentation-output.log ]; then
            tail -n 300 build-artifacts/torrent-tv-smoke/instrumentation-output.log
          else
            echo "Instrumentation output file was not produced."
          fi
          echo "::endgroup::"

          echo "::group::Torrent TV smoke markers"
          grep -R "TORRENT_TV_SMOKE\|TorrentTvSmoke" -n \
            build-artifacts/torrent-tv-smoke app/build 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::ADB logcat smoke markers"
          grep -E "TORRENT_TV_SMOKE|TorrentTvSmoke|FATAL EXCEPTION|AndroidRuntime|AssertionError" \
            build-artifacts/torrent-tv-smoke/adb-logcat.txt 2>/dev/null \
            | tail -n 300 || true
          echo "::endgroup::"

          if [ -f emulator.log ]; then
            echo "::group::Emulator tail"
            tail -n 160 emulator.log
            echo "::endgroup::"
          fi

          # The smoke is allowed to fail without ending the job, so release
          # emulator resources before deterministic JVM/build checks continue.
          timeout 15s adb emu kill >/dev/null 2>&1 || true

      - name: Lint debug
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Unit tests parser
        run: ./gradlew --no-daemon --stacktrace :core:parser:test

      - name: Unit tests core model
        run: ./gradlew --no-daemon --stacktrace :core:model:test

      - name: Unit tests sync
        run: ./gradlew --no-daemon --stacktrace :sync:testDebugUnitTest

      - name: Unit tests core data
        run: ./gradlew --no-daemon --stacktrace :core:data:testDebugUnitTest

      - name: Unit tests core engine
        run: ./gradlew --no-daemon --stacktrace :core:engine:testDebugUnitTest

      - name: Unit tests core P2P
        run: ./gradlew --no-daemon --stacktrace :core:p2p:testDebugUnitTest

      - name: Unit tests core network
        run: ./gradlew --no-daemon --stacktrace :core:network:testDebugUnitTest

      - name: Unit tests core player
        run: ./gradlew --no-daemon --stacktrace :core:player:testDebugUnitTest

      - name: Unit tests core player VLC
        run: ./gradlew --no-daemon --stacktrace :core:player-vlc:testDebugUnitTest

      - name: Unit tests feature diagnostics
        run: ./gradlew --no-daemon --stacktrace :feature:diagnostics:testDebugUnitTest

      - name: Unit tests feature EPG
        run: ./gradlew --no-daemon --stacktrace :feature:epg:testDebugUnitTest

      - name: Unit tests feature home
        run: ./gradlew --no-daemon --stacktrace :feature:home:testDebugUnitTest

      - name: Unit tests feature importer
        run: ./gradlew --no-daemon --stacktrace :feature:importer:testDebugUnitTest

      - name: Unit tests feature playlists
        run: ./gradlew --no-daemon --stacktrace :feature:playlists:testDebugUnitTest

      - name: Unit tests feature player
        run: ./gradlew --no-daemon --stacktrace :feature:player:testDebugUnitTest

      - name: Unit tests feature scanner
        run: ./gradlew --no-daemon --stacktrace :feature:scanner:testDebugUnitTest

      - name: Unit tests feature settings
        run: ./gradlew --no-daemon --stacktrace :feature:settings:testDebugUnitTest

      - name: Print failed unit test reports
        if: failure()
        run: |
          found=0
          while IFS= read -r -d '' report; do
            if grep -Eq 'failures="[1-9]|errors="[1-9]"' "$report"; then
              found=1
              echo "::group::$report"
              sed -n '1,220p' "$report"
              echo "::endgroup::"
            fi
          done < <(find . -path '*/build/test-results/testDebugUnitTest/*.xml' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No failed JUnit XML report was produced. The Gradle test JVM may have crashed before writing results."
          fi

      - name: Assemble debug for validation
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Compile Android instrumentation tests for validation
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Assemble compact signed ARM TV APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info assembleRelease 2>&1 | tee assemble-release.log

      - name: Prepare installable TV APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/tv
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            build-artifacts/tv/Rinat-IPTV-TV-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            build-artifacts/tv/Rinat-IPTV-TV-armeabi-v7a.apk
          cd build-artifacts/tv
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Package clean source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/source
          git archive --format=zip \
            --prefix=iptv-tv-app-updated/ \
            --output=build-artifacts/source/iptv-tv-app-updated-source.zip \
            HEAD

      - name: Upload TV Box APKs only
        uses: actions/upload-artifact@v7
        with:
          name: tv-box-apks
          path: |
            build-artifacts/tv/Rinat-IPTV-TV-arm64-v8a.apk
            build-artifacts/tv/Rinat-IPTV-TV-armeabi-v7a.apk
            build-artifacts/tv/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload clean source archive
        uses: actions/upload-artifact@v7
        with:
          name: iptv-tv-app-updated-source
          path: build-artifacts/source/iptv-tv-app-updated-source.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload unit/lint/release reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-lint-release-reports
          path: |
            assemble-release.log
            emulator.log
            build-artifacts/torrent-tv-smoke/**
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
            **/build/outputs/mapping/**

      - name: Enforce real Torrent TV playback smoke result
        if: >-
          always() &&
          steps.torrent-tv-smoke.outputs.run == 'true' &&
          steps.torrent-tv-playback-smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "The real Torrent TV smoke failed. Deterministic checks and APK packaging were allowed to finish."
          echo "Inspect the torrent-tv-smoke diagnostics artifact before rerunning or changing application code."
          exit 1
