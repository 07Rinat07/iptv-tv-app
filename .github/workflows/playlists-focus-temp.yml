name: Temporary Playlists focus patch

on:
  push:
    branches:
      - feat/playlists-action-focus-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/playlists-action-focus-scroll
      - name: Apply Playlists focus-follow patch
        run: |
          python - <<'PY'
          from pathlib import Path

          screen = Path('feature/playlists/src/main/java/com/iptv/tv/feature/playlists/PlaylistsScreen.kt')
          text = screen.read_text()
          old_import = 'import com.iptv.tv.core.designsystem.theme.tvFocusOutline\n'
          new_import = 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\nimport com.iptv.tv.core.designsystem.theme.tvFocusOutline\n'
          if old_import not in text or 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\n' in text:
              raise SystemExit('unexpected Playlists import state')
          text = text.replace(old_import, new_import, 1)

          old = '''        item {\n            FlowRow(\n                horizontalArrangement = Arrangement.spacedBy(8.dp),\n                verticalArrangement = Arrangement.spacedBy(8.dp)\n            ) {\n                Button(\n                    onClick = viewModel::refreshSelectedPlaylist,'''
          new = '''        item {\n            FlowRow(\n                modifier = Modifier.tvBringIntoViewOnFocus(),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),\n                verticalArrangement = Arrangement.spacedBy(8.dp)\n            ) {\n                Button(\n                    onClick = viewModel::refreshSelectedPlaylist,'''
          if old not in text:
              raise SystemExit('Playlists action group snippet not found')
          text = text.replace(old, new, 1)
          screen.write_text(text)

          roadmap = Path('docs/ROADMAP.md')
          road = roadmap.read_text()
          old_road = 'Settings selection/section controls, основные source action-группы Importer и action controls Network Test также используют focus-follow;'
          new_road = 'Settings selection/section controls, основные source action-группы Importer, action controls Network Test и standalone action-группа Playlists также используют focus-follow;'
          if old_road not in road:
              raise SystemExit('ROADMAP progress snippet not found')
          roadmap.write_text(road.replace(old_road, new_road, 1))
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/playlists-focus-temp.yml
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/playlists/src/main/java/com/iptv/tv/feature/playlists/PlaylistsScreen.kt docs/ROADMAP.md
          git commit -m "feat(playlists): keep actions visible on focus"
          git push origin HEAD:feat/playlists-action-focus-scroll
