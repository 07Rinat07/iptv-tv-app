name: Apply settings lock guard

on:
  push:
    branches:
      - fix/settings-start-destination-navigation

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch lock-aware quick-start navigation
        shell: python
        run: |
          from pathlib import Path

          vm = Path('feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsViewModel.kt')
          text = vm.read_text(encoding='utf-8')
          old = '''    fun setAppStartDestination(destination: AppStartDestination) {\n        if (!ensureSettingsUnlocked()) return\n        viewModelScope.launch {\n            settingsRepository.setAppStartDestination(destination)\n            _uiState.update {\n                it.copy(\n                    lastInfo = "Стартовый экран: ${destination.toUiLabel()}",\n                    lastError = null\n                )\n            }\n        }\n    }'''
          new = '''    fun setAppStartDestination(destination: AppStartDestination): Boolean {\n        if (!ensureSettingsUnlocked()) return false\n        viewModelScope.launch {\n            settingsRepository.setAppStartDestination(destination)\n            _uiState.update {\n                it.copy(\n                    lastInfo = "Стартовый экран: ${destination.toUiLabel()}",\n                    lastError = null\n                )\n            }\n        }\n        return true\n    }'''
          if old not in text:
              raise SystemExit('SettingsViewModel target block not found')
          vm.write_text(text.replace(old, new, 1), encoding='utf-8')

          screen = Path('feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt')
          text = screen.read_text(encoding='utf-8')
          for destination in ('HOME', 'PLAYER', 'SCANNER', 'FAVORITES', 'PLAYLISTS'):
              old = f'''                        onClick = {{\n                            viewModel.setAppStartDestination(CoreAppStartDestination.{destination})\n                            onOpenStartDestination?.invoke(CoreAppStartDestination.{destination})\n                        }},'''
              new = f'''                        onClick = {{\n                            if (viewModel.setAppStartDestination(CoreAppStartDestination.{destination})) {{\n                                onOpenStartDestination?.invoke(CoreAppStartDestination.{destination})\n                            }}\n                        }},'''
              if old not in text:
                  raise SystemExit(f'SettingsScreen target block not found: {destination}')
              text = text.replace(old, new, 1)
          screen.write_text(text, encoding='utf-8')

      - name: Verify diff
        run: |
          git diff --check
          git diff -- feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsViewModel.kt feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsViewModel.kt feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt
          git commit -m "fix(settings): navigate only after destination change is accepted"
          git push
