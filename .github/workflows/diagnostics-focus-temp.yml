name: Temporary diagnostics focus patch

on:
  push:
    branches: [feat/diagnostics-tab-focus-scroll]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diagnostics-tab-focus-scroll
          fetch-depth: 0
      - name: Patch diagnostics tabs and roadmap
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('feature/diagnostics/src/main/java/com/iptv/tv/feature/diagnostics/DiagnosticsScreen.kt')
          s = p.read_text(encoding='utf-8')
          anchor = 'import com.iptv.tv.core.designsystem.components.TvScrollableLazyColumn\n'
          imp = 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\n'
          assert anchor in s
          if imp not in s:
              s = s.replace(anchor, anchor + imp, 1)

          old_selected = '''                            Button(onClick = { selectedTab = tab }) {\n                                Text(tab.title)\n                            }'''
          new_selected = '''                            Button(\n                                onClick = { selectedTab = tab },\n                                modifier = Modifier.tvBringIntoViewOnFocus()\n                            ) {\n                                Text(tab.title)\n                            }'''
          assert old_selected in s or new_selected in s
          if old_selected in s:
              s = s.replace(old_selected, new_selected, 1)

          old_unselected = '''                            OutlinedButton(onClick = { selectedTab = tab }) {\n                                Text(tab.title)\n                            }'''
          new_unselected = '''                            OutlinedButton(\n                                onClick = { selectedTab = tab },\n                                modifier = Modifier.tvBringIntoViewOnFocus()\n                            ) {\n                                Text(tab.title)\n                            }'''
          assert old_unselected in s or new_unselected in s
          if old_unselected in s:
              s = s.replace(old_unselected, new_unselected, 1)
          p.write_text(s, encoding='utf-8')

          r = Path('docs/ROADMAP.md')
          t = r.read_text(encoding='utf-8')
          old = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм; standalone actions уже подключены на About и History, аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;\n'
          new = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм; standalone actions подключены на About и History, верхние вкладки Diagnostics также удерживаются в видимой области; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;\n'
          assert old in t or new in t
          if old in t:
              t = t.replace(old, new, 1)
          r.write_text(t, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/diagnostics/src/main/java/com/iptv/tv/feature/diagnostics/DiagnosticsScreen.kt docs/ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(diagnostics): keep tabs visible on focus"
          git push origin HEAD:feat/diagnostics-tab-focus-scroll
