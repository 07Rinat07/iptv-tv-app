name: Apply verified startup cleanup v4

on:
  push:
    branches:
      - feat/startup-player-diagnostics-cleanup

permissions:
  contents: write

concurrency:
  group: verified-startup-cleanup-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and apply verified cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-startup-cleanup.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          replacement = r'''app_gradle_marker = '\nval tvBoxDebugApkName = "myscanerIPTV-tvbox-debug-latest.apk"'
          app_gradle_start = app_gradle_text.find(app_gradle_marker)
          if app_gradle_start < 0:
              raise RuntimeError("Unable to find tracked APK copy task in app/build.gradle.kts")
          app_gradle_text = app_gradle_text[:app_gradle_start] + "\n"
          app_gradle.write_text(app_gradle_text, encoding="utf-8")'''

          script, count = re.subn(
              r'app_gradle_text, count = re\.subn\(.*?app_gradle\.write_text\(app_gradle_text, encoding="utf-8"\)',
              lambda _: replacement,
              script,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise RuntimeError('Unable to patch APK cleanup block')
          Path('/tmp/apply-startup-cleanup.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-startup-cleanup.py

          # GitHub Actions token cannot modify workflow files. Keep them unchanged in this commit;
          # they are cleaned with the GitHub connector after the verified source commit is pushed.
          git restore --source=HEAD --staged --worktree .github/workflows

      - name: Verify protected scanner and search sources
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -E '^(feature/scanner/|core/network/|core/domain/.*/ScannerRepository\.kt$|core/domain/.*/SearchPlaylistsUseCase\.kt$)'; then
            echo "Protected scanner/search source changed" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused tests, lint and builds
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :feature:home:testDebugUnitTest \
            :feature:diagnostics:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Commit verified source and documentation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(app): player-first startup, log reset and repository cleanup"
          git push origin HEAD:feat/startup-player-diagnostics-cleanup
