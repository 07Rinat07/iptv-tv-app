name: Temporary EPG foreground refresh patch

on:
  push:
    branches:
      - fix/epg-foreground-refresh-r1

permissions:
  contents: write

jobs:
  apply-patch:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epg-foreground-refresh-r1
          persist-credentials: true
      - name: Apply guarded IptvApp wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/iptv/tv/IptvApp.kt')
          text = path.read_text()

          replacements = [
              (
                  '    private val processStartedAtElapsedMs = SystemClock.elapsedRealtime()\n'
                  '    private var startedActivityCount = 0\n',
                  '    private val processStartedAtElapsedMs = SystemClock.elapsedRealtime()\n'
                  '    private var startedActivityCount = 0\n'
                  '    private val epgForegroundRefreshGate = EpgForegroundRefreshGate()\n'
              ),
              (
                  '            override fun onActivityStarted(activity: Activity) {\n'
                  '                startedActivityCount += 1\n'
                  '                if (startedActivityCount == 1) markProcessForeground(foreground = true)\n'
                  '            }\n',
                  '            override fun onActivityStarted(activity: Activity) {\n'
                  '                startedActivityCount += 1\n'
                  '                if (startedActivityCount == 1) {\n'
                  '                    markProcessForeground(foreground = true)\n'
                  '                    if (epgForegroundRefreshGate.onForegroundEntered()) {\n'
                  '                        requestEpgRefreshOnForegroundIfStale()\n'
                  '                    }\n'
                  '                }\n'
                  '            }\n'
              ),
              (
                  '    override fun onLowMemory() {\n',
                  '    private fun requestEpgRefreshOnForegroundIfStale() {\n'
                  '        applicationScope.launch(Dispatchers.IO) {\n'
                  '            val current = epgSettingsRepository.get().currentSettings()\n'
                  '            if (\n'
                  '                shouldRequestEpgRefreshOnForeground(\n'
                  '                    returningToForeground = true,\n'
                  '                    settings = current\n'
                  '                )\n'
                  '            ) {\n'
                  '                SyncScheduler.requestEpgRefresh(WorkManager.getInstance(this@IptvApp))\n'
                  '            }\n'
                  '        }\n'
                  '    }\n\n'
                  '    override fun onLowMemory() {\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected guarded source block exactly once, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- app/src/main/java/com/iptv/tv/IptvApp.kt
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/iptv/tv/IptvApp.kt
          git diff --cached --quiet && exit 1
          git commit -m 'fix(epg): refresh stale guide on foreground return'
          git push origin HEAD:fix/epg-foreground-refresh-r1
