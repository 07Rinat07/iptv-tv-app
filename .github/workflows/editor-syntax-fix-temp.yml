name: Temporary Editor syntax fix

on:
  push:
    branches:
      - feat/editor-tv-scroll-navigation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editor-tv-scroll-navigation
          fetch-depth: 0
      - name: Fix Editor container braces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('feature/editor/src/main/java/com/iptv/tv/feature/editor/EditorScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = "                }\n            }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun ChannelMetadataSummary"
          new = "                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun ChannelMetadataSummary"
          assert old in s, 'expected duplicated brace sequence not found'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/editor-syntax-fix-temp.yml
      - name: Commit fix
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/editor/src/main/java/com/iptv/tv/feature/editor/EditorScreen.kt .github/workflows/editor-syntax-fix-temp.yml
          git diff --cached --check
          git commit -m "fix(editor): close shared list container correctly"
          git push origin HEAD:feat/editor-tv-scroll-navigation
