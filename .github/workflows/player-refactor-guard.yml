name: Player Refactor Guard

on:
  pull_request:
    paths:
      - 'feature/player/**'
      - 'feature/scanner/**'
      - 'core/scanner/**'
      - 'docs/PROJECT_STATUS_AND_ROADMAP.md'
      - '.github/workflows/player-refactor-guard.yml'

permissions:
  contents: read

jobs:
  player-refactor-boundary:
    if: startsWith(github.head_ref, 'refactor/player-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep Player refactors out of Scanner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(feature/scanner|core/scanner)/'; then
            echo 'Player refactor must not modify Scanner production/query/discovery files.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Player and Scanner regression tests
        run: ./gradlew :feature:player:testDebugUnitTest :feature:scanner:testDebugUnitTest --stacktrace
