name: Player Refactor Guard

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/iptv/tv/MainActivity.kt'
      - 'feature/player/**'
      - 'core/player/**'
      - 'core/player-vlc/**'
      - 'feature/scanner/**'
      - 'feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsViewModel.kt'
      - 'feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt'
      - 'feature/settings/src/main/java/com/iptv/tv/feature/settings/NetworkTestViewModel.kt'
      - 'feature/settings/src/main/java/com/iptv/tv/feature/settings/NetworkTestScreen.kt'
      - 'core/model/src/main/kotlin/com/iptv/tv/core/model/Models.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/api/ScannerApis.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/datasource/PublicRepositoryScannerDataSource.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/dto/ScannerDtos.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/di/NetworkModule.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/dns/ResilientDns.kt'
      - 'core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/ScannerRepository.kt'
      - 'core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/SettingsRepository.kt'
      - 'core/domain/src/main/kotlin/com/iptv/tv/core/domain/usecase/SearchPlaylistsUseCase.kt'
      - 'core/data/src/main/java/com/iptv/tv/core/data/di/RepositoryModule.kt'
      - 'core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt'
      - 'core/data/src/main/java/com/iptv/tv/core/data/settings/SettingsStore.kt'
      - 'docs/PROJECT_STATUS_AND_ROADMAP.md'
      - '.github/workflows/player-refactor-guard.yml'

permissions:
  contents: read

jobs:
  player-refactor-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Protect Scanner contracts when Player behavior changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from typing import Optional

          BASE_SHA = os.environ["BASE_SHA"]
          HEAD_SHA = os.environ["HEAD_SHA"]

          def git_text(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True)

          merge_base = git_text("merge-base", BASE_SHA, HEAD_SHA).strip()
          changed = set(filter(None, git_text("diff", "--no-renames", "--name-only", merge_base, HEAD_SHA).splitlines()))
          for path in sorted(changed):
              print(path)

          def content_at(ref: str, path: str) -> str:
              try:
                  return git_text("show", f"{ref}:{path}")
              except subprocess.CalledProcessError:
                  return ""

          def changed_lines(path: str) -> list[str]:
              if path not in changed:
                  return []
              diff = git_text("diff", "--no-renames", "-U0", merge_base, HEAD_SHA, "--", path)
              result: list[str] = []
              for line in diff.splitlines():
                  if line.startswith(("+++", "---", "@@")):
                      continue
                  if line.startswith(("+", "-")):
                      result.append(line[1:])
              return result

          def changed_line_matches(path: str, pattern: str) -> bool:
              regex = re.compile(pattern, re.IGNORECASE)
              return any(regex.search(line) for line in changed_lines(path))

          def section_between(text: str, start_marker: str, end_marker: str) -> Optional[str]:
              start = text.find(start_marker)
              if start < 0:
                  return None
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  return None
              return text[start:end]

          def section_changed(path: str, start_marker: str, end_marker: str) -> bool:
              if path not in changed:
                  return False
              before = section_between(content_at(merge_base, path), start_marker, end_marker)
              after = section_between(content_at(HEAD_SHA, path), start_marker, end_marker)
              if before is None or after is None:
                  print(
                      f"Ownership markers missing for {path}: "
                      f"{start_marker!r} -> {end_marker!r}; classifying as changed (fail closed).",
                      file=sys.stderr,
                  )
                  return True
              return before != after

          def declaration_text(text: str, marker: str) -> Optional[str]:
              start = text.find(marker)
              if start < 0:
                  return None

              paren_depth = 0
              bracket_depth = 0
              index = start
              while index < len(text):
                  char = text[index]
                  if char == "(":
                      paren_depth += 1
                  elif char == ")":
                      paren_depth = max(0, paren_depth - 1)
                  elif char == "[":
                      bracket_depth += 1
                  elif char == "]":
                      bracket_depth = max(0, bracket_depth - 1)
                  elif char == "{" and paren_depth == 0 and bracket_depth == 0:
                      depth = 1
                      cursor = index + 1
                      while cursor < len(text):
                          nested = text[cursor]
                          if nested == "{":
                              depth += 1
                          elif nested == "}":
                              depth -= 1
                              if depth == 0:
                                  return text[start:cursor + 1]
                          cursor += 1
                      return text[start:]
                  elif char == "\n" and paren_depth == 0 and bracket_depth == 0:
                      return text[start:index]
                  index += 1
              return text[start:]

          def definition_changed(path: str, marker: str) -> bool:
              if path not in changed:
                  return False
              before = declaration_text(content_at(merge_base, path), marker)
              after = declaration_text(content_at(HEAD_SHA, path), marker)
              if before is None or after is None:
                  print(
                      f"Guarded declaration marker {marker!r} appeared/disappeared in {path}; "
                      "classifying as changed (fail closed).",
                      file=sys.stderr,
                  )
                  return True
              return before != after

          def any_definition_changed(path: str, markers: list[str]) -> bool:
              return any(definition_changed(path, marker) for marker in markers)

          synthetic = (
              "data class ManualBufferSettings(\n"
              "    val startMs: Int\n"
              ")\n"
              "enum class ScannerProviderScope { ALL }\n"
          )
          synthetic_manual = declaration_text(synthetic, "data class ManualBufferSettings")
          if synthetic_manual is None or "ScannerProviderScope" in synthetic_manual:
              raise RuntimeError("declaration_text must stop after a bodyless parenthesized declaration")

          MAIN = "app/src/main/java/com/iptv/tv/MainActivity.kt"
          MODELS = "core/model/src/main/kotlin/com/iptv/tv/core/model/Models.kt"
          SETTINGS_REPO = "core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/SettingsRepository.kt"
          SETTINGS_STORE = "core/data/src/main/java/com/iptv/tv/core/data/settings/SettingsStore.kt"
          SETTINGS_VM = "feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsViewModel.kt"
          SETTINGS_SCREEN = "feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt"
          REPOSITORIES = "core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt"
          REPOSITORY_MODULE = "core/data/src/main/java/com/iptv/tv/core/data/di/RepositoryModule.kt"
          NETWORK_TEST_VM = "feature/settings/src/main/java/com/iptv/tv/feature/settings/NetworkTestViewModel.kt"
          NETWORK_TEST_SCREEN = "feature/settings/src/main/java/com/iptv/tv/feature/settings/NetworkTestScreen.kt"

          player_changed = any(
              path.startswith(("feature/player/", "core/player/", "core/player-vlc/"))
              for path in changed
          )

          if MAIN in changed:
              player_changed = player_changed or section_changed(
                  MAIN,
                  "composable(Routes.PLAYER) {",
                  "composable(Routes.DOWNLOADS) {",
              )
              player_changed = player_changed or changed_line_matches(
                  MAIN,
                  r"StablePlayerScreen|isPlayerRoute|playerFullscreen|Routes\.playerRoute|Routes\.PLAYER",
              )

          player_changed = player_changed or any_definition_changed(
              MODELS,
              ["enum class PlayerType", "enum class BufferProfile", "data class ManualBufferSettings"],
          )
          player_changed = player_changed or changed_line_matches(
              SETTINGS_STORE,
              r"defaultPlayer|bufferProfile|manualStartMs|manualRebufferMs|manualMaxMs|channelPlayerOverrides",
          )
          player_changed = player_changed or any_definition_changed(
              SETTINGS_REPO,
              [
                  "fun observeDefaultPlayer(",
                  "fun observeBufferProfile(",
                  "fun observeManualBuffer(",
                  "fun observeChannelPlayerOverride(",
                  "fun setDefaultPlayer(",
                  "fun setBufferProfile(",
                  "fun setManualBuffer(",
                  "fun setChannelPlayerOverride(",
              ],
          )
          player_changed = player_changed or any_definition_changed(
              SETTINGS_VM,
              [
                  "fun setDefaultPlayer(",
                  "fun setBufferProfile(",
                  "fun updateManualStart(",
                  "fun updateManualRebuffer(",
                  "fun updateManualMax(",
                  "fun saveManualBuffer(",
              ],
          )
          player_changed = player_changed or section_changed(
              SETTINGS_VM,
              "val defaultPlayer:",
              "val engineEndpoint:",
          )
          player_changed = player_changed or section_changed(
              SETTINGS_VM,
              "settingsRepository.observeDefaultPlayer()",
              "settingsRepository.observeEngineEndpoint()",
          )
          player_changed = player_changed or changed_line_matches(
              SETTINGS_SCREEN,
              r"showPlayerSettings|showBufferSettings",
          )
          player_changed = player_changed or section_changed(
              SETTINGS_SCREEN,
              "expanded = showPlayerSettings,",
              "expanded = showEngineSettings,",
          )
          player_changed = player_changed or any_definition_changed(
              REPOSITORIES,
              [
                  "fun observeDefaultPlayer(",
                  "fun observeBufferProfile(",
                  "fun observeManualBuffer(",
                  "fun observeChannelPlayerOverride(",
                  "fun setDefaultPlayer(",
                  "fun setBufferProfile(",
                  "fun setManualBuffer(",
                  "fun setChannelPlayerOverride(",
                  "fun parseChannelOverrides(",
                  "fun encodeChannelOverrides(",
              ],
          )

          recommended_changed = definition_changed(SETTINGS_VM, "fun applyRecommendedSettings(")
          player_changed = player_changed or recommended_changed

          if not player_changed:
              print("No Player-owned production/test/routing/settings behavior changed; Scanner boundary is not applicable.")
              sys.exit(0)

          scanner_direct_paths = {
              NETWORK_TEST_VM,
              NETWORK_TEST_SCREEN,
              "core/network/src/main/java/com/iptv/tv/core/network/api/ScannerApis.kt",
              "core/network/src/main/java/com/iptv/tv/core/network/datasource/PublicRepositoryScannerDataSource.kt",
              "core/network/src/main/java/com/iptv/tv/core/network/dto/ScannerDtos.kt",
              "core/network/src/main/java/com/iptv/tv/core/network/di/NetworkModule.kt",
              "core/network/src/main/java/com/iptv/tv/core/network/dns/ResilientDns.kt",
              "core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/ScannerRepository.kt",
              "core/domain/src/main/kotlin/com/iptv/tv/core/domain/usecase/SearchPlaylistsUseCase.kt",
          }
          scanner_changed = any(path.startswith("feature/scanner/") for path in changed)
          scanner_changed = scanner_changed or any(path in changed for path in scanner_direct_paths)

          if MAIN in changed:
              scanner_changed = scanner_changed or section_changed(
                  MAIN,
                  "composable(Routes.SCANNER) {",
                  "composable(Routes.IMPORTER) {",
              )

          scanner_changed = scanner_changed or any_definition_changed(
              MODELS,
              [
                  "data class ScannerProxySettings",
                  "data class ScannerLearnedQuery",
                  "data class PlaylistCandidate",
                  "enum class ScannerProviderScope",
                  "enum class ScannerSearchMode",
                  "data class ScannerSearchRequest",
              ],
          )
          scanner_changed = scanner_changed or changed_line_matches(
              SETTINGS_STORE,
              r"scanner(AiEnabled|ProxyEnabled|ProxyHost|ProxyPort|ProxyUsername|ProxyPassword|LearnedQueries)",
          )
          scanner_changed = scanner_changed or any_definition_changed(
              SETTINGS_REPO,
              [
                  "fun observeScannerAiEnabled(",
                  "fun observeScannerProxySettings(",
                  "fun observeScannerLearnedQueries(",
                  "fun setScannerAiEnabled(",
                  "fun setScannerProxySettings(",
                  "fun recordScannerLearning(",
                  "fun clearScannerLearning(",
              ],
          )
          scanner_changed = scanner_changed or any_definition_changed(
              SETTINGS_VM,
              [
                  "fun setScannerAiEnabled(",
                  "fun setScannerProxyEnabled(",
                  "fun updateScannerProxyHost(",
                  "fun updateScannerProxyPort(",
                  "fun updateScannerProxyUsername(",
                  "fun updateScannerProxyPassword(",
                  "fun saveScannerProxySettings(",
              ],
          )
          scanner_changed = scanner_changed or section_changed(
              SETTINGS_VM,
              "val scannerAiEnabled:",
              "val parentalEnabled:",
          )
          scanner_changed = scanner_changed or section_changed(
              SETTINGS_VM,
              "settingsRepository.observeScannerAiEnabled()",
              "settingsRepository.observeParentalControlSettings()",
          )
          scanner_changed = scanner_changed or changed_line_matches(
              SETTINGS_SCREEN,
              r"showAiScanner|showScannerProxy|showNetworkTest",
          )
          scanner_changed = scanner_changed or section_changed(
              SETTINGS_SCREEN,
              "expanded = showAiScanner,",
              "expanded = showPlayerSettings,",
          )
          scanner_changed = scanner_changed or section_changed(
              REPOSITORY_MODULE,
              "    @Binds\n    @Singleton\n    abstract fun bindScannerRepository",
              "    @Binds\n    @Singleton\n    abstract fun bindPlaylistRepository",
          )
          scanner_changed = scanner_changed or definition_changed(REPOSITORIES, "class ScannerRepositoryImpl")
          scanner_changed = scanner_changed or any_definition_changed(
              REPOSITORIES,
              [
                  "fun observeScannerAiEnabled(",
                  "fun observeScannerProxySettings(",
                  "fun observeScannerLearnedQueries(",
                  "fun setScannerAiEnabled(",
                  "fun setScannerProxySettings(",
                  "fun recordScannerLearning(",
                  "fun clearScannerLearning(",
                  "fun encodeScannerLearnedQueries(",
                  "fun decodeScannerLearnedQueries(",
              ],
          )
          scanner_changed = scanner_changed or recommended_changed

          if scanner_changed:
              print(
                  "Player changes must not modify Scanner production/query/discovery/model/network/settings contracts.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Player/Scanner ownership boundary passed.")
          PY

      - name: Verify exact checked-out revision
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Player and Scanner regression tests
        run: |
          ./gradlew \
            :feature:player:testDebugUnitTest \
            :core:player:testDebugUnitTest \
            :core:player-vlc:testDebugUnitTest \
            :feature:scanner:testDebugUnitTest \
            :feature:settings:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:domain:test \
            --stacktrace
