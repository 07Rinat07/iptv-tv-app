name: Player Refactor Guard

on:
  pull_request:
    paths:
      - 'feature/player/**'
      - 'core/player/**'
      - 'core/player-vlc/**'
      - 'feature/scanner/**'
      - 'core/network/src/main/java/com/iptv/tv/core/network/api/ScannerApis.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/datasource/PublicRepositoryScannerDataSource.kt'
      - 'core/network/src/main/java/com/iptv/tv/core/network/dto/ScannerDtos.kt'
      - 'core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/ScannerRepository.kt'
      - 'core/domain/src/main/kotlin/com/iptv/tv/core/domain/usecase/SearchPlaylistsUseCase.kt'
      - 'core/data/src/main/java/com/iptv/tv/core/data/di/RepositoryModule.kt'
      - 'core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt'
      - 'docs/PROJECT_STATUS_AND_ROADMAP.md'
      - '.github/workflows/player-refactor-guard.yml'

permissions:
  contents: read

jobs:
  player-refactor-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Protect Scanner contracts when Player code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"

          if ! printf '%s\n' "$changed" | grep -Eq '^(feature/player/|core/player/|core/player-vlc/)'; then
            echo 'No Player-owned production/test files changed; Scanner boundary is not applicable.'
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(feature/scanner/|core/network/src/main/java/com/iptv/tv/core/network/api/ScannerApis\.kt$|core/network/src/main/java/com/iptv/tv/core/network/datasource/PublicRepositoryScannerDataSource\.kt$|core/network/src/main/java/com/iptv/tv/core/network/dto/ScannerDtos\.kt$|core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/ScannerRepository\.kt$|core/domain/src/main/kotlin/com/iptv/tv/core/domain/usecase/SearchPlaylistsUseCase\.kt$|core/data/src/main/java/com/iptv/tv/core/data/di/RepositoryModule\.kt$|core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories\.kt$)'; then
            echo 'Player changes must not modify Scanner production/query/discovery contracts.' >&2
            exit 1
          fi

      - name: Verify exact checked-out revision
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Player and Scanner regression tests
        run: |
          ./gradlew \
            :feature:player:testDebugUnitTest \
            :feature:scanner:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:domain:test \
            --stacktrace
