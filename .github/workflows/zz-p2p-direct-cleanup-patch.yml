name: Apply P2P direct cleanup patch

on:
  push:
    branches:
      - fix/p2p-stop-on-direct-playback
    paths:
      - .github/workflows/zz-p2p-direct-cleanup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch player lifecycle
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_exactly_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected one {label} block, found {count}")
              return updated

          vm = Path("feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt")
          text = vm.read_text(encoding="utf-8")

          direct_pattern = (
              r'^(?P<i>[ \t]*)if \(!forceAceResolution && aceDescriptor == null\) \{\n'
              r'(?P=i)    return AppResult\.Success\(url\)\n'
              r'(?P=i)\}'
          )
          def direct_replacement(match):
              i = match.group('i')
              return (
                  f"{i}if (!forceAceResolution && aceDescriptor == null) {{\n"
                  f"{i}    // A direct IPTV request supersedes any previously active embedded torrent.\n"
                  f"{i}    // Cleanup errors must not block direct playback.\n"
                  f"{i}    engineRepository.stopTorrentStream()\n"
                  f"{i}    return AppResult.Success(url)\n"
                  f"{i}}}"
              )
          text = replace_exactly_once(text, direct_pattern, direct_replacement, "direct-playback")

          stop_pattern = (
              r'^(?P<i>[ \t]*)fun stopInternalPlayback\(\) \{\n'
              r'(?P=i)    invalidatePrimaryPlaybackRequest\(\)'
          )
          def stop_replacement(match):
              i = match.group('i')
              return (
                  f"{i}fun stopInternalPlayback() {{\n"
                  f"{i}    // Repository-owned cleanup survives ViewModel scope cancellation during navigation.\n"
                  f"{i}    engineRepository.releaseTorrentStream()\n"
                  f"{i}    invalidatePrimaryPlaybackRequest()"
              )
          text = replace_exactly_once(text, stop_pattern, stop_replacement, "stopInternalPlayback")
          vm.write_text(text, encoding="utf-8")

          screen = Path("feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt")
          text = screen.read_text(encoding="utf-8")
          dispose_pattern = (
              r'^(?P<i>[ \t]*)DisposableEffect\(Unit\) \{\n'
              r'(?P=i)    onDispose \{ onFullscreenChanged\(false\) \}\n'
              r'(?P=i)\}'
          )
          def dispose_replacement(match):
              i = match.group('i')
              return (
                  f"{i}DisposableEffect(Unit) {{\n"
                  f"{i}    onDispose {{\n"
                  f"{i}        viewModel.stopInternalPlayback()\n"
                  f"{i}        onFullscreenChanged(false)\n"
                  f"{i}    }}\n"
                  f"{i}}}"
              )
          text = replace_exactly_once(text, dispose_pattern, dispose_replacement, "screen DisposableEffect")
          screen.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/zz-p2p-direct-cleanup-patch.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt \
                  feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt \
                  .github/workflows/zz-p2p-direct-cleanup-patch.yml
          git diff --cached --check
          git commit -m "fix(player): release embedded P2P on direct playback and exit"
          git push origin HEAD:fix/p2p-stop-on-direct-playback
