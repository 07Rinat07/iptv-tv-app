name: Apply P2P direct cleanup patch

on:
  push:
    branches:
      - fix/p2p-stop-on-direct-playback
    paths:
      - .github/workflows/zz-p2p-direct-cleanup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch player lifecycle
        shell: python
        run: |
          from pathlib import Path

          vm = Path("feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt")
          text = vm.read_text(encoding="utf-8")

          old_direct = '''        if (!forceAceResolution && aceDescriptor == null) {
              return AppResult.Success(url)
          }
          '''
          new_direct = '''        if (!forceAceResolution && aceDescriptor == null) {
              // A direct IPTV request supersedes any previously active embedded torrent.
              // Cleanup errors must not block direct playback.
              engineRepository.stopTorrentStream()
              return AppResult.Success(url)
          }
          '''
          if text.count(old_direct) != 1:
              raise SystemExit(f"Expected one direct-playback block, found {text.count(old_direct)}")
          text = text.replace(old_direct, new_direct, 1)

          old_stop = '''    fun stopInternalPlayback() {
              invalidatePrimaryPlaybackRequest()
          '''
          new_stop = '''    fun stopInternalPlayback() {
              // Repository-owned cleanup survives ViewModel scope cancellation during navigation.
              engineRepository.releaseTorrentStream()
              invalidatePrimaryPlaybackRequest()
          '''
          if text.count(old_stop) != 1:
              raise SystemExit(f"Expected one stopInternalPlayback block, found {text.count(old_stop)}")
          text = text.replace(old_stop, new_stop, 1)
          vm.write_text(text, encoding="utf-8")

          screen = Path("feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt")
          text = screen.read_text(encoding="utf-8")
          old_dispose = '''    DisposableEffect(Unit) {
              onDispose { onFullscreenChanged(false) }
          }
          '''
          new_dispose = '''    DisposableEffect(Unit) {
              onDispose {
                  viewModel.stopInternalPlayback()
                  onFullscreenChanged(false)
              }
          }
          '''
          if text.count(old_dispose) != 1:
              raise SystemExit(f"Expected one screen DisposableEffect block, found {text.count(old_dispose)}")
          text = text.replace(old_dispose, new_dispose, 1)
          screen.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/zz-p2p-direct-cleanup-patch.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt \
                  feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt \
                  .github/workflows/zz-p2p-direct-cleanup-patch.yml
          git diff --cached --check
          git commit -m "fix(player): release embedded P2P on direct playback and exit"
          git push origin HEAD:fix/p2p-stop-on-direct-playback
