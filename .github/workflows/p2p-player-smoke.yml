name: P2P player smoke

on:
  pull_request:
    paths:
      - 'core/player/src/main/java/com/iptv/tv/core/player/PlayerContracts.kt'
      - 'feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerVideoSurface.kt'
      - 'feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt'
      - 'feature/player/src/main/java/com/iptv/tv/feature/player/P2pPlayerBoundaryTelemetry.kt'
      - '.github/workflows/p2p-player-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'core/player/src/main/java/com/iptv/tv/core/player/PlayerContracts.kt'
      - 'feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerVideoSurface.kt'
      - 'feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt'
      - 'feature/player/src/main/java/com/iptv/tv/feature/player/P2pPlayerBoundaryTelemetry.kt'
      - '.github/workflows/p2p-player-smoke.yml'

permissions:
  contents: read

concurrency:
  group: p2p-player-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torrent-tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_AVD_HOME: /tmp/android-avd
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT" "$ANDROID_AVD_HOME"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            'emulator' \
            "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Compile Android instrumentation tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Run real Torrent TV playback smoke without Ace Engine
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          echo 'no' | avdmanager create avd \
            --force \
            --name iptv-ci \
            --package "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"

          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd iptv-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-metrics \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!

          if ! timeout 45 adb wait-for-device; then
            tail -n 160 emulator.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi
          if ! timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            tail -n 160 emulator.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true

          if adb shell pm list packages | grep -qi 'acestream'; then
            echo 'Unexpected Ace Stream package found on clean emulator'
            exit 1
          fi

          adb logcat -c || true
          ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.iptv.tv.TorrentTvPlaybackSmokeTest

      - name: Print smoke diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          timeout 20s adb logcat -d -v threadtime | tail -n 300 || true
          tail -n 160 emulator.log || true
