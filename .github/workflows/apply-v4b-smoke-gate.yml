name: Apply V4b smoke gate coverage

on:
  push:
    branches:
      - agent/p2p-media3-load-control-v4b
    paths:
      - '.github/workflows/apply-v4b-smoke-gate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend Torrent TV smoke detector for P2P player boundary changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android.yml')
          text = path.read_text()
          old = "|core/(p2p|engine)/|core/data/src/main/java/com/iptv/tv/core/data/repository/"
          new = "|core/(p2p|engine)/|core/player/src/main/java/com/iptv/tv/core/player/PlayerContracts\\.kt|feature/player/src/main/java/com/iptv/tv/feature/player/(StablePlayerVideoSurface|StablePlayerScreenReplacement|P2pPlayerBoundaryTelemetry)\\.kt|core/data/src/main/java/com/iptv/tv/core/data/repository/"
          if text.count(old) != 1:
              raise SystemExit(f'expected detector anchor exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit detector fix and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v4b-smoke-gate.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/android.yml .github/workflows/apply-v4b-smoke-gate.yml
          git diff --cached --check
          git commit -m 'ci: run Torrent TV smoke for P2P player boundary changes'
          git push origin HEAD:${GITHUB_REF_NAME}
