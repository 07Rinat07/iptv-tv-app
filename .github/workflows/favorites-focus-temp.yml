name: Temporary Favorites action focus patch

on:
  push:
    branches:
      - feat/favorites-action-focus-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/favorites-action-focus-scroll
          fetch-depth: 0
      - name: Apply Favorites focus-follow patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          screen = Path('feature/favorites/src/main/java/com/iptv/tv/feature/favorites/FavoritesScreen.kt')
          s = screen.read_text(encoding='utf-8')
          old_import = 'import com.iptv.tv.core.designsystem.theme.tvFocusOutline\n'
          new_import = 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\nimport com.iptv.tv.core.designsystem.theme.tvFocusOutline\n'
          if old_import not in s:
              raise SystemExit('Favorites focus import marker not found')
          s = s.replace(old_import, new_import, 1)
          old_flow = 'modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),'
          new_flow = 'modifier = Modifier\n                    .fillMaxWidth()\n                    .tvBringIntoViewOnFocus(),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),'
          if old_flow not in s:
              raise SystemExit('Favorites top action FlowRow marker not found')
          s = s.replace(old_flow, new_flow, 1)
          screen.write_text(s, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text(encoding='utf-8')
          old = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм; standalone actions подключены на About и History, верхние вкладки Diagnostics также удерживаются в видимой области; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;'
          new = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм; standalone actions подключены на About и History, верхние вкладки Diagnostics и основная action-группа Favorites также удерживаются в видимой области; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;'
          if old not in r:
              raise SystemExit('ROADMAP focus-follow marker not found')
          roadmap.write_text(r.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/favorites-focus-temp.yml
      - name: Commit Favorites focus-follow patch
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/favorites/src/main/java/com/iptv/tv/feature/favorites/FavoritesScreen.kt docs/ROADMAP.md .github/workflows/favorites-focus-temp.yml
          git diff --cached --check
          git commit -m "feat(favorites): keep main actions visible on focus"
          git push origin HEAD:feat/favorites-action-focus-scroll
