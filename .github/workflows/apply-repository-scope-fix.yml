name: Apply repository scope correction

on:
  push:
    branches:
      - fix/player-device-acceptance-blockers
    paths:
      - .automation/apply-repository-scope-fix.py
      - .github/workflows/apply-repository-scope-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Apply correction
        run: python3 .automation/apply-repository-scope-fix.py

      - name: Remove temporary applicator and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/apply-repository-scope-fix.py
          rm -f .github/workflows/apply-repository-scope-fix.yml
          rmdir .automation 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(data): restore repository helpers and favorite inheritance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
