name: EPG wiring patch r1

on:
  push:
    branches:
      - feat/epg-persistent-snapshot-wiring-r1
    paths:
      - .github/workflows/epg-wiring-patch-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epg-persistent-snapshot-wiring-r1
          fetch-depth: 0

      - name: Apply exact repository patch
        run: |
          python -c 'from pathlib import Path; p=Path(".github/scripts/epg_wiring_patch_r1.py"); s=p.read_text(); needle="    expected=3,\n)\n\nnew_loader"; assert s.count(needle) == 1; p.write_text(s.replace(needle, "    expected=2,\n)\n\nnew_loader", 1))'
          python .github/scripts/epg_wiring_patch_r1.py
          sed -i 's/loadFresh = ::getOrLoadXmlTv/loadFresh = { url -> getOrLoadXmlTv(url) }/g' core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          sed -i 's/captureStaleFallback = ::staleEpgEntryForActiveTransientBackoff/captureStaleFallback = { url -> staleEpgEntryForActiveTransientBackoff(url) }/g' core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git diff --check
          grep -R -n --include='*.kt' 'PlaylistRepositoryImpl(' core/data/src/test core/data/src/main || true
          git diff -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt

      - name: Commit repository wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git commit -m "feat(epg): wire persistent snapshots into repository"
          git push origin HEAD:feat/epg-persistent-snapshot-wiring-r1
