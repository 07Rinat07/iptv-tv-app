name: EPG wiring patch r1

on:
  push:
    branches:
      - feat/epg-persistent-snapshot-wiring-r1
    paths:
      - .github/workflows/epg-wiring-patch-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epg-persistent-snapshot-wiring-r1
          fetch-depth: 0

      - name: Make EPG mutex suspension-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt")
          text = path.read_text()

          old = "        return epgLoadMutex.withLock {\n"
          new = "        epgLoadMutex.lock()\n        return try {\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          assert text.count("return@withLock") == 2
          text = text.replace("return@withLock", "return")

          old_tail = "                throw failure\n            }\n        }\n    }\n    private fun freshEpgEntry"
          new_tail = "                throw failure\n            }\n        } finally {\n            epgLoadMutex.unlock()\n        }\n    }\n\n    private fun freshEpgEntry"
          assert text.count(old_tail) == 1
          text = text.replace(old_tail, new_tail, 1)

          assert text.count("import kotlinx.coroutines.sync.withLock\n") == 1
          text = text.replace("import kotlinx.coroutines.sync.withLock\n", "", 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt

      - name: Commit mutex correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git commit -m "fix(epg): keep Room calls outside non-suspending lock action"
          git push origin HEAD:feat/epg-persistent-snapshot-wiring-r1
