name: EPG day guide patch r1

on:
  push:
    branches:
      - feat/epg-player-day-guide-r1
    paths:
      - .github/workflows/epg-day-guide-patch-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epg-player-day-guide-r1
          fetch-depth: 0

      - name: Apply exact day guide wiring patch
        run: |
          python .github/scripts/epg_day_guide_patch_r1.py
          git diff --check
          git diff -- core/model/src/main/kotlin/com/iptv/tv/core/model/Models.kt
          git diff -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git diff -- core/data/src/main/java/com/iptv/tv/core/data/repository/VirtualRecentChannelsPlaylistRepository.kt
          git diff -- feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt

      - name: Commit day guide wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/model/src/main/kotlin/com/iptv/tv/core/model/Models.kt \
            core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt \
            core/data/src/main/java/com/iptv/tv/core/data/repository/VirtualRecentChannelsPlaylistRepository.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt
          git commit -m "feat(epg): wire selected-channel day guide payload"
          git push origin HEAD:feat/epg-player-day-guide-r1
