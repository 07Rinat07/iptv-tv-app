name: Apply player input patch

on:
  push:
    branches:
      - feat/libvlc-fallback
    paths:
      - .github/workflows/apply-player-input.yml

permissions:
  contents: write

concurrency:
  group: apply-player-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/libvlc-fallback
          fetch-depth: 0

      - name: Apply focused player input patch
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import zlib
          payload = ""
          exec(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Test and build all variants
        run: >-
          ./gradlew --no-daemon --stacktrace
          :feature:player:testDebugUnitTest
          lintDebug
          assembleDebug
          assembleRelease

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/player-vlc/src/main/java/com/iptv/tv/core/playervlc/LibVlcPlaybackController.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerInput.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerScreenReplacement.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StablePlayerVideoSurface.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/StableLibVlcVideoSurface.kt \
            feature/player/src/test/java/com/iptv/tv/feature/player/StablePlayerScreenTest.kt \
            .github/workflows/apply-player-input.yml
          git commit -m "feat(player): unify mouse touchpad and remote controls"
          git push origin HEAD:feat/libvlc-fallback
