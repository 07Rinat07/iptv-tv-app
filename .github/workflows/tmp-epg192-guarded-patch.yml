name: Temporary EPG192 guarded patch

on:
  push:
    branches:
      - feat/epg-match-diagnostics
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/epg-match-diagnostics
          fetch-depth: 0

      - name: Apply exact guarded diagnostics wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          workflow = Path('.github/workflows/tmp-epg192-guarded-patch.yml')
          trigger = Path('.github/tmp-epg192-trigger')

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode()
              return hashlib.sha1(header + data).hexdigest()

          original = path.read_bytes()
          original_sha = git_blob_sha(original)
          expected_original = 'f41f054536d92d60aaad46c8449cacdb62881b08'
          if original_sha != expected_original:
              raise SystemExit(f'base blob mismatch: {original_sha} != {expected_original}')

          text = original.decode('utf-8')
          import_anchor = 'import com.iptv.tv.core.model.PlaylistImportReport\n'
          import_replacement = import_anchor + 'import com.iptv.tv.core.model.PlaylistEpgDiagnostics\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('PlaylistImportReport import anchor not unique')
          text = text.replace(import_anchor, import_replacement, 1)

          method_anchor = '    override suspend fun getPlaylistEpgWindow(\n'
          if text.count(method_anchor) != 1:
              raise SystemExit('getPlaylistEpgWindow anchor not unique')

          diagnostics_method = '''    override suspend fun getPlaylistEpgDiagnostics(playlistId: Long): AppResult<PlaylistEpgDiagnostics> =
        withContext(Dispatchers.IO) {
            if (playlistId <= 0) return@withContext AppResult.Error("Invalid playlist id")

            val playlist = playlistDao.findById(playlistId)
                ?: return@withContext AppResult.Error("Playlist not found: id=$playlistId")
            val candidates = resolveEpgCandidates(playlist)
            if (candidates.isEmpty()) {
                return@withContext AppResult.Error(
                    "EPG source URL is not configured and was not discovered for playlist ${playlist.id}"
                )
            }

            val parentalGate = currentParentalChannelGate()
            val channels = channelDao.getChannels(playlistId)
                .asSequence()
                .filter { !it.isHidden }
                .filterNot { it.isBlockedByParental(parentalGate) }
                .toList()

            var firstLoadedDiagnostics: PlaylistEpgDiagnostics? = null
            var lastLoadError: Throwable? = null
            for (epgUrl in candidates) {
                val epgData = try {
                    getOrLoadXmlTv(epgUrl)
                } catch (throwable: Exception) {
                    lastLoadError = throwable
                    continue
                }
                val diagnostics = EpgMatchDiagnosticsPolicy.summarize(
                    playlistId = playlistId,
                    epgSourceUrl = epgUrl,
                    sourceLoadedAtMs = epgCache[epgUrl]?.loadedAtMs,
                    observations = channels.map { channel ->
                        val match = matchChannelToEpg(
                            channelName = channel.name,
                            tvgId = channel.tvgId,
                            data = epgData
                        )
                        EpgMatchObservation(
                            matchedBy = match.matchedBy,
                            hasPrograms = match.programs.isNotEmpty()
                        )
                    }
                )
                if (firstLoadedDiagnostics == null) firstLoadedDiagnostics = diagnostics
                if (diagnostics.matchedChannels > 0) {
                    return@withContext AppResult.Success(diagnostics)
                }
            }

            firstLoadedDiagnostics?.let { return@withContext AppResult.Success(it) }
            if (lastLoadError != null) {
                return@withContext AppResult.Error(
                    "Unable to load EPG diagnostics: ${lastLoadError!!.toLogSummary(maxDepth = 4)}",
                    lastLoadError
                )
            }
            AppResult.Error("EPG diagnostics are unavailable for playlist $playlistId")
        }

'''
          text = text.replace(method_anchor, diagnostics_method + method_anchor, 1)

          updated = text.encode('utf-8')
          updated_sha = git_blob_sha(updated)
          expected_updated = '272e138bafe77e05c800093091385046cf8e8aff'
          if updated_sha != expected_updated:
              raise SystemExit(f'updated blob mismatch: {updated_sha} != {expected_updated}')

          path.write_bytes(updated)
          workflow.unlink()
          if trigger.exists():
              trigger.unlink()
          print(f'guarded patch verified: {original_sha} -> {updated_sha}')
          PY

      - name: Commit exact guarded patch and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt .github/workflows/tmp-epg192-guarded-patch.yml .github/tmp-epg192-trigger
          git diff --cached --check
          git commit -m "feat(epg): wire structured match diagnostics"
          git push origin HEAD:feat/epg-match-diagnostics
