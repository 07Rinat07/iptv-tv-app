name: Database Unit CI

on:
  pull_request:
    paths:
      - 'core/database/**'
      - 'core/data/**'
      - '.github/workflows/database-unit.yml'
  push:
    branches:
      - main
    paths:
      - 'core/database/**'
      - 'core/data/**'
      - '.github/workflows/database-unit.yml'

permissions:
  contents: read

concurrency:
  group: database-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Unit tests core database
        run: ./gradlew --no-daemon --stacktrace :core:database:testDebugUnitTest

      - name: Unit tests core data
        run: ./gradlew --no-daemon --stacktrace :core:data:testDebugUnitTest
