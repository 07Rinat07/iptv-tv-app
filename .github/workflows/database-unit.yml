name: Database Unit CI

on:
  pull_request:
    paths:
      - 'core/database/**'
      - 'core/data/**'
      - 'feature/favorites/**'
      - '.github/workflows/database-unit.yml'
  push:
    branches:
      - main
    paths:
      - 'core/database/**'
      - 'core/data/**'
      - 'feature/favorites/**'
      - '.github/workflows/database-unit.yml'

permissions:
  contents: write

concurrency:
  group: database-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Unit tests core database
        run: ./gradlew --no-daemon --stacktrace :core:database:testDebugUnitTest

      - name: Unit tests core data
        run: ./gradlew --no-daemon --stacktrace :core:data:testDebugUnitTest

      - name: Unit tests feature favorites
        run: ./gradlew --no-daemon --stacktrace :feature:favorites:testDebugUnitTest


  epg192-guarded-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head for guarded patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact EPG192 wiring and restore workflow files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import base64
          import hashlib
          import os
          import subprocess

          repo_path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          carrier = Path('.github/workflows/database-unit.yml')
          temp_workflow = Path('.github/workflows/tmp-epg192-guarded-patch.yml')
          trigger = Path('.github/tmp-epg192-trigger')

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          original = repo_path.read_bytes()
          original_sha = git_blob_sha(original)
          expected_original = 'f41f054536d92d60aaad46c8449cacdb62881b08'
          if original_sha != expected_original:
              raise SystemExit(f'base repository blob mismatch: {original_sha} != {expected_original}')

          text = original.decode('utf-8')
          import_anchor = 'import com.iptv.tv.core.model.PlaylistImportReport\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('PlaylistImportReport import anchor not unique')
          text = text.replace(
              import_anchor,
              import_anchor + 'import com.iptv.tv.core.model.PlaylistEpgDiagnostics\n',
              1,
          )

          method_anchor = '    override suspend fun getPlaylistEpgWindow(\n'
          if text.count(method_anchor) != 1:
              raise SystemExit('getPlaylistEpgWindow anchor not unique')
          diagnostics_method = base64.b64decode('').decode('utf-8')
          text = text.replace(method_anchor, diagnostics_method + method_anchor, 1)

          updated = text.encode('utf-8')
          updated_sha = git_blob_sha(updated)
          expected_updated = '272e138bafe77e05c800093091385046cf8e8aff'
          if updated_sha != expected_updated:
              raise SystemExit(f'updated repository blob mismatch: {updated_sha} != {expected_updated}')
          repo_path.write_bytes(updated)

          base_sha = os.environ['BASE_SHA']
          restored = subprocess.check_output(['git', 'show', f'{base_sha}:.github/workflows/database-unit.yml'])
          expected_carrier = '7740bcf62761da0b54f4c85abdf1ae1e49641aee'
          restored_sha = git_blob_sha(restored)
          if restored_sha != expected_carrier:
              raise SystemExit(f'carrier restore blob mismatch: {restored_sha} != {expected_carrier}')
          carrier.write_bytes(restored)
          if temp_workflow.exists():
              temp_workflow.unlink()
          if trigger.exists():
              trigger.unlink()
          print(f'guarded patch verified: {original_sha} -> {updated_sha}; carrier={restored_sha}')
          PY_PATCH

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt .github/workflows/database-unit.yml .github/workflows/tmp-epg192-guarded-patch.yml .github/tmp-epg192-trigger
          git diff --cached --check
          git commit -m "feat(epg): wire structured match diagnostics"
          git push origin "HEAD:${HEAD_REF}"
