name: Database Unit CI

on:
  pull_request:
    paths:
      - 'core/database/**'
      - 'core/data/**'
      - 'feature/favorites/**'
      - '.github/workflows/database-unit.yml'
  push:
    branches:
      - main
    paths:
      - 'core/database/**'
      - 'core/data/**'
      - 'feature/favorites/**'
      - '.github/workflows/database-unit.yml'

permissions:
  contents: write

concurrency:
  group: database-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          java-package: jdk
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Unit tests core database
        run: ./gradlew --no-daemon --stacktrace :core:database:testDebugUnitTest

      - name: Unit tests core data
        run: ./gradlew --no-daemon --stacktrace :core:data:testDebugUnitTest

      - name: Unit tests feature favorites
        run: ./gradlew --no-daemon --stacktrace :feature:favorites:testDebugUnitTest

  epg193-guarded-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/epg-stale-transient-fallback' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head for guarded patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact EPG193 loader patch and restore workflow
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          data = path.read_bytes()
          blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          expected = '999d1f8bdac9cff3954a841250f134f1a833b7db'
          if blob != expected:
              raise SystemExit(f'base Repositories blob mismatch: {blob} != {expected}')
          print(f'base blob verified: {blob}')
          PY

          git apply --check .github/epg193-repositories.patch
          git apply .github/epg193-repositories.patch

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          data = path.read_bytes()
          blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          expected = '549fb87e5d94e83c52128d58759ff592b7ca4b66'
          if blob != expected:
              raise SystemExit(f'updated Repositories blob mismatch: {blob} != {expected}')
          print(f'updated blob verified: {blob}')
          PY

          git show "$BASE_SHA:.github/workflows/database-unit.yml" > .github/workflows/database-unit.yml
          rm .github/epg193-repositories.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt .github/workflows/database-unit.yml .github/epg193-repositories.patch
          git commit -m "fix(epg): wire bounded stale refresh fallback"
          git push origin HEAD:fix/epg-stale-transient-fallback
