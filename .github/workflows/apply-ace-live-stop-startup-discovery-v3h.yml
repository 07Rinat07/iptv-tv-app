name: Apply Ace Live startup discovery shutdown V3h

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/ace-live-stop-startup-discovery-v3h' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V3h patch
        run: python3 .github/scripts/apply_ace_live_stop_startup_discovery_v3h.py

      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(p2p): stop startup discovery after stable ready"
          git push origin HEAD:agent/ace-live-stop-startup-discovery-v3h
