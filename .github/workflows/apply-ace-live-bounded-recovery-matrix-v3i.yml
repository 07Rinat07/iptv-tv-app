name: Apply Ace Live bounded recovery matrix V3i

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/ace-live-bounded-recovery-matrix-v3i' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V3i patch
        run: python3 .github/scripts/apply_ace_live_bounded_recovery_matrix_v3i.py

      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(p2p): ignore lagging peers in bounded gap recovery"
          git push origin HEAD:agent/ace-live-bounded-recovery-matrix-v3i
