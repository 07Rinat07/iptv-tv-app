name: Apply Ace Live adaptive request depth V3e

on:
  push:
    branches:
      - agent/ace-live-adaptive-request-depth-v3e

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ace-live-adaptive-request-depth-v3e
          fetch-depth: 0

      - name: Apply bounded adaptive request depth
