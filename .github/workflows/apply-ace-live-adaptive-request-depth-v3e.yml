name: Apply Ace Live adaptive request depth V3e

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/ace-live-adaptive-request-depth-v3e' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V3e patch
        run: python3 .github/scripts/apply_ace_live_adaptive_request_depth_v3e.py

      - name: Validate and commit
        shell: bash
        run: |
          rm -f .github/scripts/apply_ace_live_adaptive_request_depth_v3e.py
          rm -f .github/workflows/apply-ace-live-adaptive-request-depth-v3e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(p2p): adapt Ace Live request depth to buffer pressure"
          git push origin HEAD:agent/ace-live-adaptive-request-depth-v3e
