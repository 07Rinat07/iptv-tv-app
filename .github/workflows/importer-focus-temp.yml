name: Temporary Importer action focus patch

on:
  push:
    branches:
      - feat/importer-action-focus-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/importer-action-focus-scroll
          fetch-depth: 0
      - name: Apply Importer focus-follow patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('feature/importer/src/main/java/com/iptv/tv/feature/importer/ImporterScreen.kt')
          s = path.read_text(encoding='utf-8')
          anchor = 'import com.iptv.tv.core.designsystem.components.TvScrollableLazyColumn\n'
          if 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\n' not in s:
              if anchor not in s:
                  raise SystemExit('designsystem import anchor not found')
              s = s.replace(
                  anchor,
                  anchor + 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\n',
                  1,
              )

          markers = [
              'TAG_IMPORTER_IMPORT_URL',
              'TAG_IMPORTER_IMPORT_XTREAM',
              'TAG_IMPORTER_IMPORT_STALKER',
              'TAG_IMPORTER_IMPORT_HDHOMERUN',
              'TAG_IMPORTER_IMPORT_TVHEADEND',
              'TAG_IMPORTER_IMPORT_JELLYFIN',
              'TAG_IMPORTER_IMPORT_PLEX',
              'TAG_IMPORTER_IMPORT_FILE',
              'TAG_IMPORTER_IMPORT_TEXT',
          ]

          for marker in markers:
              pos = s.find(marker, s.find('fun ImporterScreen'))
              if pos < 0:
                  raise SystemExit(f'marker not found: {marker}')
              row_start = s.rfind('Row(', 0, pos)
              if row_start < 0:
                  raise SystemExit(f'Row not found for: {marker}')
              row_end = s.find(') {', row_start, pos)
              if row_end < 0:
                  raise SystemExit(f'Row header end not found for: {marker}')
              row_end += 3
              header = s[row_start:row_end]
              if 'tvBringIntoViewOnFocus()' in header:
                  continue
              if 'modifier = Modifier.padding(top = 8.dp)' in header:
                  new_header = header.replace(
                      'modifier = Modifier.padding(top = 8.dp)',
                      'modifier = Modifier.padding(top = 8.dp).tvBringIntoViewOnFocus()',
                      1,
                  )
              elif 'modifier =' not in header:
                  new_header = header.replace(
                      'Row(',
                      'Row(modifier = Modifier.tvBringIntoViewOnFocus(), ',
                      1,
                  )
              else:
                  raise SystemExit(f'unexpected Row header for {marker}: {header}')
              s = s[:row_start] + new_header + s[row_end:]

          path.write_text(s, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text(encoding='utf-8')
          old = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм; standalone actions подключены на About и History, верхние вкладки Diagnostics, основная action-группа Favorites и action-группы Downloads также удерживаются в видимой области; Settings selection/section controls также используют focus-follow; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;'
          if old not in r:
              raise SystemExit('ROADMAP focus-follow line not found')
          new = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм; standalone actions подключены на About и History, верхние вкладки Diagnostics, основная action-группа Favorites и action-группы Downloads также удерживаются в видимой области; Settings selection/section controls и основные source action-группы Importer также используют focus-follow; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;'
          roadmap.write_text(r.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/importer-focus-temp.yml
      - name: Commit Importer focus-follow patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/importer/src/main/java/com/iptv/tv/feature/importer/ImporterScreen.kt docs/ROADMAP.md .github/workflows/importer-focus-temp.yml
          git diff --cached --check
          git commit -m "feat(importer): keep source actions visible on focus"
          git push origin HEAD:feat/importer-action-focus-scroll
