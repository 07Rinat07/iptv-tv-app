name: Ace Stream service integration

on:
  push:
    branches:
      - feat/acestream-service-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acestream-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged player descriptor detection
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          script=.automation/apply_acestream_player_detection.py
          if [[ ! -f "$script" ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$script"
          rm -f "$script"
          git diff --check
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Verify protected scanner and search sources
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check docs/stage11-protected-scanner.sha256
          if git diff --name-only origin/main...HEAD | grep -E '^(feature/scanner/|core/network/|core/domain/.*/ScannerRepository\.kt$|core/domain/.*/SearchPlaylistsUseCase\.kt$|feature/scanner/.*/LocalAiQueryAssistant\.kt$)'; then
            echo "Protected scanner/search path changed" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Ace Stream and regression tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:engine:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :feature:playlists:testDebugUnitTest \
            :feature:favorites:testDebugUnitTest \
            :feature:scanner:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug and release APKs
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Rinat-IPTV-acestream-service
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acestream-service-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit verified implementation
        if: steps.patch.outputs.applied == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/feat/acestream-service-integration'
        shell: bash
        run: |
          git config user.name "Rinat Sarmuldin"
          git config user.email "ura07srr@gmail.com"
          rm -f .github/workflows/acestream-service-integration-ci.yml
          git add -A
          git commit -m "feat(acestream): integrate official Android engine service"
          git push
