name: Apply TV scroll key navigation

on:
  push:
    branches:
      - feat/tv-scroll-key-navigation

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TV scroll key foundation
        shell: python
        run: |
          from pathlib import Path

          build = Path('core/designsystem/build.gradle.kts')
          text = build.read_text(encoding='utf-8')
          old = '''    implementation(libs.androidx.compose.material3)\n    debugImplementation(libs.androidx.compose.ui.tooling)\n}'''
          new = '''    implementation(libs.androidx.compose.material3)\n    debugImplementation(libs.androidx.compose.ui.tooling)\n\n    testImplementation(libs.junit4)\n}'''
          if old not in text:
              raise SystemExit('designsystem dependency block not found')
          build.write_text(text.replace(old, new, 1), encoding='utf-8')

          policy = Path('core/designsystem/src/main/java/com/iptv/tv/core/designsystem/components/TvListNavigationPolicy.kt')
          policy.write_text('''package com.iptv.tv.core.designsystem.components\n\ninternal enum class TvListScrollCommand {\n    START,\n    PAGE_UP,\n    PAGE_DOWN,\n    END\n}\n\ninternal fun calculateTvListScrollTarget(\n    command: TvListScrollCommand,\n    firstVisibleItemIndex: Int,\n    visibleItemCount: Int,\n    totalItemCount: Int\n): Int? {\n    if (totalItemCount <= 0) return null\n\n    val lastIndex = totalItemCount - 1\n    val firstVisible = firstVisibleItemIndex.coerceIn(0, lastIndex)\n    val pageSize = (visibleItemCount.coerceAtLeast(1) - 1).coerceAtLeast(1)\n\n    return when (command) {\n        TvListScrollCommand.START -> 0\n        TvListScrollCommand.PAGE_UP -> (firstVisible - pageSize).coerceAtLeast(0)\n        TvListScrollCommand.PAGE_DOWN -> (firstVisible + pageSize).coerceAtMost(lastIndex)\n        TvListScrollCommand.END -> lastIndex\n    }\n}\n''', encoding='utf-8')

          test = Path('core/designsystem/src/test/java/com/iptv/tv/core/designsystem/components/TvListNavigationPolicyTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package com.iptv.tv.core.designsystem.components\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertNull\nimport org.junit.Test\n\nclass TvListNavigationPolicyTest {\n    @Test\n    fun pageDown_advancesByVisiblePageMinusOverlap() {\n        assertEquals(9, calculateTvListScrollTarget(TvListScrollCommand.PAGE_DOWN, 3, 7, 30))\n    }\n\n    @Test\n    fun pageUp_clampsAtStart() {\n        assertEquals(0, calculateTvListScrollTarget(TvListScrollCommand.PAGE_UP, 3, 7, 30))\n    }\n\n    @Test\n    fun pageDown_clampsAtLastItem() {\n        assertEquals(9, calculateTvListScrollTarget(TvListScrollCommand.PAGE_DOWN, 8, 5, 10))\n    }\n\n    @Test\n    fun startAndEnd_areDeterministic() {\n        assertEquals(0, calculateTvListScrollTarget(TvListScrollCommand.START, 5, 4, 12))\n        assertEquals(11, calculateTvListScrollTarget(TvListScrollCommand.END, 5, 4, 12))\n    }\n\n    @Test\n    fun emptyList_hasNoTarget() {\n        assertNull(calculateTvListScrollTarget(TvListScrollCommand.PAGE_DOWN, 0, 0, 0))\n    }\n\n    @Test\n    fun invalidVisibleCount_stillMovesOneItem() {\n        assertEquals(5, calculateTvListScrollTarget(TvListScrollCommand.PAGE_DOWN, 4, 0, 10))\n    }\n}\n''', encoding='utf-8')

          component = Path('core/designsystem/src/main/java/com/iptv/tv/core/designsystem/components/TvScrollableLazyColumn.kt')
          text = component.read_text(encoding='utf-8')
          old_import = '''import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.input.pointer.pointerInput'''
          new_import = '''import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.input.key.Key\nimport androidx.compose.ui.input.key.KeyEventType\nimport androidx.compose.ui.input.key.key\nimport androidx.compose.ui.input.key.onPreviewKeyEvent\nimport androidx.compose.ui.input.key.type\nimport androidx.compose.ui.input.pointer.pointerInput'''
          if old_import not in text:
              raise SystemExit('TvScrollableLazyColumn import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_setup = '''    val screenWidthDp = LocalConfiguration.current.screenWidthDp\n    val showControls = showPageControls && screenWidthDp >= scrollControlsMinScreenWidthDp\n\n    Row('''
          new_setup = '''    val screenWidthDp = LocalConfiguration.current.screenWidthDp\n    val showControls = showPageControls && screenWidthDp >= scrollControlsMinScreenWidthDp\n    val keyScrollScope = rememberCoroutineScope()\n\n    Row('''
          if old_setup not in text:
              raise SystemExit('TvScrollableLazyColumn setup anchor not found')
          text = text.replace(old_setup, new_setup, 1)

          old_modifier = '''            modifier = Modifier\n                .weight(1f)\n                .fillMaxHeight(),'''
          new_modifier = '''            modifier = Modifier\n                .weight(1f)\n                .fillMaxHeight()\n                .onPreviewKeyEvent { event ->\n                    if (event.type != KeyEventType.KeyDown) return@onPreviewKeyEvent false\n                    val command = when (event.key) {\n                        Key.PageUp, Key.ChannelUp -> TvListScrollCommand.PAGE_UP\n                        Key.PageDown, Key.ChannelDown -> TvListScrollCommand.PAGE_DOWN\n                        else -> null\n                    } ?: return@onPreviewKeyEvent false\n                    val target = calculateTvListScrollTarget(\n                        command = command,\n                        firstVisibleItemIndex = state.firstVisibleItemIndex,\n                        visibleItemCount = state.layoutInfo.visibleItemsInfo.size,\n                        totalItemCount = state.layoutInfo.totalItemsCount\n                    ) ?: return@onPreviewKeyEvent false\n                    keyScrollScope.launch { state.animateScrollToItem(target) }\n                    true\n                },'''
          if old_modifier not in text:
              raise SystemExit('TvScrollableLazyColumn modifier anchor not found')
          text = text.replace(old_modifier, new_modifier, 1)

          old_page_up = '''            onClick = {\n                val target = (firstVisible - pageSize).coerceAtLeast(0)\n                scope.launch { listState.animateScrollToItem(target) }\n            }'''
          new_page_up = '''            onClick = {\n                val target = calculateTvListScrollTarget(\n                    command = TvListScrollCommand.PAGE_UP,\n                    firstVisibleItemIndex = firstVisible,\n                    visibleItemCount = visibleItems,\n                    totalItemCount = totalItems\n                ) ?: return@TvScrollButton\n                scope.launch { listState.animateScrollToItem(target) }\n            }'''
          if old_page_up not in text:
              raise SystemExit('page up anchor not found')
          text = text.replace(old_page_up, new_page_up, 1)

          old_page_down = '''            onClick = {\n                val target = (firstVisible + pageSize).coerceAtMost(lastIndex)\n                scope.launch { listState.animateScrollToItem(target) }\n            }'''
          new_page_down = '''            onClick = {\n                val target = calculateTvListScrollTarget(\n                    command = TvListScrollCommand.PAGE_DOWN,\n                    firstVisibleItemIndex = firstVisible,\n                    visibleItemCount = visibleItems,\n                    totalItemCount = totalItems\n                ) ?: return@TvScrollButton\n                scope.launch { listState.animateScrollToItem(target) }\n            }'''
          if old_page_down not in text:
              raise SystemExit('page down anchor not found')
          text = text.replace(old_page_down, new_page_down, 1)

          # pageSize and lastIndex are no longer needed by the rail after policy extraction.
          text = text.replace('''    val pageSize = (visibleItems - 1).coerceAtLeast(1)\n    val lastIndex = (totalItems - 1).coerceAtLeast(0)\n''', '', 1)
          text = text.replace('''    val showHome = canScrollUp && firstVisible >= pageSize\n''', '''    val showHome = canScrollUp && firstVisible > 0\n''', 1)
          component.write_text(text, encoding='utf-8')

      - name: Verify diff
        run: |
          git diff --check
          git diff -- core/designsystem

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/designsystem
          git commit -m "feat(tv): add reusable page-key list navigation"
          git push
