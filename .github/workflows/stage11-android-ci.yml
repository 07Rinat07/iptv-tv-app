name: Stage 11 Android CI

on:
  push:
    branches:
      - stage11-tv-ui-player-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage11-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged implementation patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.automation/stage11.patch.gz.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/stage11.patch
          echo "1fc1126764d21d55f722f4c16870863a3e29ad1d9c6e9e65241710a5f7ff8387  /tmp/stage11.patch" | sha256sum --check -
          git apply --check /tmp/stage11.patch
          git apply /tmp/stage11.patch

          # Compose 1.6 exposes nativeKeyEvent as a KeyEvent member, not as an importable extension.
          sed -i '/^import androidx.compose.ui.input.key.nativeKeyEvent$/d' \
            feature/player/src/main/java/com/iptv/tv/feature/player/PlayerScreen.kt

          rm -f "${parts[@]}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Verify protected scanner and search files
        shell: bash
        run: sha256sum --check docs/stage11-protected-scanner.sha256

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint and build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:player:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myscanerIPTV-stage11-debug
          path: |
            build-artifacts/myscanerIPTV-tvbox-debug-latest.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11-verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit verified implementation
        if: steps.patch.outputs.applied == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/stage11-tv-ui-player-hardening'
        shell: bash
        run: |
          git config user.name "Rinat Sarmuldin"
          git config user.email "ura07srr@gmail.com"
          git add -A
          git commit -m "feat(tv-ui): improve adaptive navigation, player channel browser, fullscreen controls and low-memory buffering"
          git push
