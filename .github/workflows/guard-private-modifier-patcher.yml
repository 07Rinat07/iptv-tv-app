name: Temporary Guard Private Modifier Patcher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/guard-private-modifier-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/epg-ambiguous-partial-match
          fetch-depth: 0

      - name: Apply strict private-helper recognition fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/player-refactor-guard.yml')
          text = path.read_text()

          player_old = '[rf"(?:override\\s+)?(?:suspend\\s+)?fun\\s+{name}\\s*\\(" for name in player_repository_functions]'
          player_new = '[rf"(?:private\\s+)?(?:override\\s+)?(?:suspend\\s+)?fun\\s+{name}\\s*\\(" for name in player_repository_functions]'
          scanner_old = '[rf"(?:override\\s+)?(?:suspend\\s+)?fun\\s+{name}\\s*\\(" for name in scanner_repository_functions]'
          scanner_new = '[rf"(?:private\\s+)?(?:override\\s+)?(?:suspend\\s+)?fun\\s+{name}\\s*\\(" for name in scanner_repository_functions]'

          if text.count(player_old) != 1:
              raise SystemExit('Expected exactly one Player repository helper pattern')
          if text.count(scanner_old) != 1:
              raise SystemExit('Expected exactly one Scanner repository helper pattern')
          text = text.replace(player_old, player_new, 1)
          text = text.replace(scanner_old, scanner_new, 1)

          marker = '''          if scanner_mode is None or not scanner_mode.lstrip().startswith("enum class ScannerSearchMode"):\n              raise RuntimeError("declaration matching must ignore comments")\n\n          MAIN = "app/src/main/java/com/iptv/tv/MainActivity.kt"\n'''
          replacement = '''          if scanner_mode is None or not scanner_mode.lstrip().startswith("enum class ScannerSearchMode"):\n              raise RuntimeError("declaration matching must ignore comments")\n\n          synthetic_private_helper = (\n              "private fun parseChannelOverrides(raw: String): Map<Long, String> {\\n"\n              "  return emptyMap()\\n"\n              "}\\n"\n          )\n          private_helper = declaration_text(\n              synthetic_private_helper,\n              r"(?:private\\s+)?(?:override\\s+)?(?:suspend\\s+)?fun\\s+parseChannelOverrides\\s*\\(",\n          )\n          if private_helper is None or not private_helper.lstrip().startswith("private fun parseChannelOverrides"):\n              raise RuntimeError("private repository helpers must remain structurally matchable")\n\n          MAIN = "app/src/main/java/com/iptv/tv/MainActivity.kt"\n'''
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one synthetic declaration insertion point')
          path.write_text(text.replace(marker, replacement, 1))
          PY

          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/player-refactor-guard.yml"

      - name: Commit strict guard fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/player-refactor-guard.yml
          git diff --cached --check
          git commit -m "fix(ci): recognize private guarded repository helpers"
          git push origin HEAD:fix/epg-ambiguous-partial-match
