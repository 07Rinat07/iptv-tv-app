name: Temporary EPG display-name alias patch

on:
  push:
    branches:
      - fix/epg-display-name-alias-index-r1

permissions:
  contents: write

jobs:
  apply-patch:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epg-display-name-alias-index-r1
          persist-credentials: true

      - name: Apply exact repository wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          text = path.read_text()

          replacements = [
              (
                  '''        val channelIdByDisplayNameKey = channelDisplayNames
                      .entries
                      .asSequence()
                      .flatMap { (channelId, names) ->
                          names.asSequence().map { displayName -> normalizeTextKey(displayName) to channelId }
                      }
                      .filter { (key, _) -> key.isNotBlank() }
                      .associateFirst()
          ''',
                  '''        val displayNameAliasIndex = EpgDisplayNameMatchPolicy.buildIndex(
                      channelDisplayNames
                          .entries
                          .asSequence()
                          .flatMap { (channelId, names) ->
                              names.asSequence().map { displayName -> normalizeTextKey(displayName) to channelId }
                          }
                          .filter { (key, _) -> key.isNotBlank() }
                          .toList()
                  )
          '''
              ),
              (
                  '''            channelIdsByTextKey = channelIdsByTextKey,
                      channelIdByDisplayNameKey = channelIdByDisplayNameKey
          ''',
                  '''            channelIdsByTextKey = channelIdsByTextKey,
                      displayNameAliasIndex = displayNameAliasIndex
          '''
              ),
              (
                  '''            val displayNameChannelId = data.channelIdByDisplayNameKey[normalizedName]
          ''',
                  '''            val displayNameChannelId = EpgDisplayNameMatchPolicy.uniqueChannelId(
                      normalizedChannelName = normalizedName,
                      index = data.displayNameAliasIndex
                  )
          '''
              ),
              (
                  '''        val channelIdsByTextKey: List<Pair<String, String>>,
                  val channelIdByDisplayNameKey: Map<String, String>
          ''',
                  '''        val channelIdsByTextKey: List<Pair<String, String>>,
                  val displayNameAliasIndex: EpgDisplayNameAliasIndex
          '''
              ),
          ]

          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement {index} expected exactly once, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt

      - name: Commit exact wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git diff --cached --quiet && exit 1
          git commit -m 'fix(epg): wire display-name alias index'
          git push origin HEAD:fix/epg-display-name-alias-index-r1
