name: Temporary Settings control focus patch

on:
  push:
    branches:
      - feat/settings-control-focus-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-control-focus-scroll
          fetch-depth: 0
      - name: Apply Settings focus-follow patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt')
          s = path.read_text(encoding='utf-8')
          import_old = 'import com.iptv.tv.core.designsystem.components.TvScrollableLazyColumn\n'
          import_new = import_old + 'import com.iptv.tv.core.designsystem.theme.tvBringIntoViewOnFocus\n'
          if 'theme.tvBringIntoViewOnFocus' not in s:
              if import_old not in s:
                  raise SystemExit('Settings import marker not found')
              s = s.replace(import_old, import_new, 1)

          toggle_old = '''                        OutlinedButton(onClick = toggle) {
                            Text(if (expanded) "Скрыть" else "Открыть")
                        }
'''
          toggle_new = '''                        OutlinedButton(
                            onClick = toggle,
                            modifier = Modifier.tvBringIntoViewOnFocus()
                        ) {
                            Text(if (expanded) "Скрыть" else "Открыть")
                        }
'''
          if toggle_old not in s:
              raise SystemExit('Settings section toggle marker not found')
          s = s.replace(toggle_old, toggle_new, 1)

          button_old = '        Button(onClick = onClick, modifier = modifier) {\n'
          button_new = '        Button(onClick = onClick, modifier = modifier.tvBringIntoViewOnFocus()) {\n'
          outlined_old = '        OutlinedButton(onClick = onClick, modifier = modifier) {\n'
          outlined_new = '        OutlinedButton(onClick = onClick, modifier = modifier.tvBringIntoViewOnFocus()) {\n'
          if button_old not in s or outlined_old not in s:
              raise SystemExit('SelectionButton marker not found')
          s = s.replace(button_old, button_new, 1)
          s = s.replace(outlined_old, outlined_new, 1)
          path.write_text(s, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          lines = roadmap.read_text(encoding='utf-8').splitlines()
          updated = False
          for i, line in enumerate(lines):
              if line.startswith('- общий `tvBringIntoViewOnFocus()`'):
                  if 'Settings selection/section controls' not in line:
                      marker = 'аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;'
                      if marker not in line:
                          raise SystemExit('ROADMAP hardware marker not found')
                      lines[i] = line.replace(
                          marker,
                          'Settings selection/section controls также используют focus-follow; ' + marker,
                          1,
                      )
                  updated = True
                  break
          if not updated:
              raise SystemExit('ROADMAP focus-follow line not found')
          roadmap.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/settings-control-focus-temp.yml
      - name: Commit Settings focus-follow patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add feature/settings/src/main/java/com/iptv/tv/feature/settings/SettingsScreen.kt docs/ROADMAP.md .github/workflows/settings-control-focus-temp.yml
          git diff --cached --check
          git commit -m "feat(settings): keep shared controls visible on focus"
          git push origin HEAD:feat/settings-control-focus-scroll
