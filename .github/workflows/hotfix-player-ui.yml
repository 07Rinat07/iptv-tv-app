name: Hotfix Player UI

on:
  push:
    branches:
      - hotfix/restore-stable-tv-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-player-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply player UI payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.hotfix/player-ui-payload.part-*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 --decode | tar -xz
          rm -f "${parts[@]}"

      - name: Verify protected scanner and search files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          protected='^(feature/scanner/|core/network/|core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/ScannerRepository.kt$|core/domain/src/main/kotlin/com/iptv/tv/core/domain/usecase/SearchPlaylistsUseCase.kt$)'
          changed="$(git diff --name-only origin/main --)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E "$protected"; then
            echo 'Protected scanner/search source changed' >&2
            exit 1
          fi
          sha256sum --check docs/stage11-protected-scanner.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, lint and Android builds
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:player:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :feature:scanner:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: myscanerIPTV-player-ui-hotfix
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-ui-hotfix-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-player-ui.yml
          rmdir .hotfix 2>/dev/null || true
          git config user.name "Rinat Sarmuldin"
          git config user.email "ura07srr@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(player-ui): restore stable navigation and focused TV dashboard"
          git push origin HEAD:hotfix/restore-stable-tv-ui
