name: Player UI Hotfix CI

on:
  push:
    branches:
      - hotfix/restore-stable-tv-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-ui-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix/restore-stable-tv-ui

      - name: Restore stable shell and apply clean player layout
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.automation/player-ui.patch.gz.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STABLE_COMMIT=2fac9fd5f181bdfe228d3db2cae3735a87ff3ec7
          git checkout "$STABLE_COMMIT" -- \
            app/src/main/java/com/iptv/tv/MainActivity.kt \
            feature/player/src/main/java/com/iptv/tv/feature/player/PlayerScreen.kt

          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/player-ui-hotfix.patch
          echo "340bfe1eb97036bec9140f21beaa82a6ab7c241c1045d971754201b0000114c8  /tmp/player-ui-hotfix.patch" | sha256sum --check -
          git apply --check /tmp/player-ui-hotfix.patch
          git apply /tmp/player-ui-hotfix.patch
          rm -f "${parts[@]}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Verify protected scanner and search sources
        shell: bash
        run: |
          set -euo pipefail
          STABLE_COMMIT=2fac9fd5f181bdfe228d3db2cae3735a87ff3ec7
          changed="$(git diff --name-only "$STABLE_COMMIT" -- \
            feature/scanner \
            core/network \
            core/domain/src/main/kotlin/com/iptv/tv/core/domain/repository/ScannerRepository.kt \
            core/domain/src/main/kotlin/com/iptv/tv/core/domain/usecase/SearchPlaylistsUseCase.kt)"
          if [[ -n "$changed" ]]; then
            echo "Protected scanner/search files changed:"
            echo "$changed"
            exit 1
          fi
          echo "Scanner and search files are unchanged."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run player tests, lint and debug build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :core:player:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :feature:scanner:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myscanerIPTV-clean-player-hotfix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-player-hotfix-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit verified hotfix
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "Rinat Sarmuldin"
          git config user.email "ura07srr@gmail.com"
          git add -A
          git commit -m "fix(tv-ui): restore clean player catalog and stable navigation"
          git push origin HEAD:hotfix/restore-stable-tv-ui
