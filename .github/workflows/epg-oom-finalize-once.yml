name: EPG OOM finalize once

on:
  push:
    branches:
      - codex/epg-oom-streaming-guard
    paths:
      - .github/workflows/epg-oom-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: codex/epg-oom-streaming-guard
          fetch-depth: 0

      - name: Format EPG block and debounce per-channel EPG zaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repositories = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          text = repositories.read_text(encoding='utf-8')
          start_marker = '    private fun getOrLoadXmlTv(url: String): XmlTvData {'
          end_marker = '    private fun parseXmlTvTime(raw: String?): Long? {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = block.splitlines(keepends=True)
          if len(lines) < 2:
              raise SystemExit('EPG block was unexpectedly empty')
          if lines[1].startswith('    ') and not lines[1].startswith('        '):
              lines = [lines[0]] + [
                  ('    ' + line) if line.strip() else line
                  for line in lines[1:]
              ]
              text = text[:start] + ''.join(lines) + text[end:]
          elif not lines[1].startswith('        '):
              raise SystemExit('EPG block indentation is not recognized')
          repositories.write_text(text, encoding='utf-8')

          player = Path('feature/player/src/main/java/com/iptv/tv/feature/player/PlayerViewModel.kt')
          player_text = player.read_text(encoding='utf-8')
          constant_anchor = 'private const val CHANNEL_LIST_EPG_REFRESH_MS = 10 * 60 * 1000L\n'
          constant_insert = constant_anchor + 'private const val EPG_CHANNEL_SELECTION_DEBOUNCE_MS = 200L\n'
          if 'EPG_CHANNEL_SELECTION_DEBOUNCE_MS' not in player_text:
              if player_text.count(constant_anchor) != 1:
                  raise SystemExit('Player EPG debounce constant anchor not found exactly once')
              player_text = player_text.replace(constant_anchor, constant_insert, 1)

          launch_anchor = (
              '        epgJob = viewModelScope.launch {\n'
              '            _uiState.update { it.copy(channelEpgInfo = null, epgStatus = "EPG: загрузка...") }\n'
          )
          launch_insert = (
              '        epgJob = viewModelScope.launch {\n'
              '            delay(EPG_CHANNEL_SELECTION_DEBOUNCE_MS)\n'
              '            _uiState.update { it.copy(channelEpgInfo = null, epgStatus = "EPG: загрузка...") }\n'
          )
          if 'delay(EPG_CHANNEL_SELECTION_DEBOUNCE_MS)' not in player_text:
              if player_text.count(launch_anchor) != 1:
                  raise SystemExit('Player EPG launch anchor not found exactly once')
              player_text = player_text.replace(launch_anchor, launch_insert, 1)
          player.write_text(player_text, encoding='utf-8')
          PY

      - name: Run focused unit tests
        shell: bash
        run: ./gradlew :core:data:testDebugUnitTest :feature:player:testDebugUnitTest --stacktrace

      - name: Commit final hotfix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/epg-oom-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(epg): coalesce guide loads while zapping"
          git push origin HEAD:codex/epg-oom-streaming-guard
