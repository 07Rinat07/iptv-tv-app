name: Temporary About focus docs patch

on:
  push:
    branches: [feat/tv-standalone-focus-scroll]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tv-standalone-focus-scroll
          fetch-depth: 0
      - name: Update roadmap
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          old = '- общий TV-focus modifier запрашивает bring-into-view при получении фокуса; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;\n'
          new = '- общий `tvBringIntoViewOnFocus()` поддерживает focus-follow без изменения стандартного вида кнопок; `tvFocusOutline()` использует тот же механизм, первый отдельный action-row подключён на экране About; аппаратная приёмка на BlueStacks/TV Box остаётся обязательной;\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise RuntimeError('focus roadmap line not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit roadmap update
        run: |
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: track reusable action focus scrolling"
          git push origin HEAD:feat/tv-standalone-focus-scroll
