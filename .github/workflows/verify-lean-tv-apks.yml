name: Verify lean TV APKs

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout lean APK branch
        uses: actions/checkout@v6
        with:
          ref: build/lean-tv-apks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Lint and unit tests
        run: |
          ./gradlew --no-daemon --stacktrace lintDebug \
            :core:parser:test \
            :sync:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:engine:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:player:testDebugUnitTest \
            :core:player-vlc:testDebugUnitTest \
            :feature:diagnostics:testDebugUnitTest \
            :feature:epg:testDebugUnitTest \
            :feature:home:testDebugUnitTest \
            :feature:importer:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :feature:scanner:testDebugUnitTest \
            :feature:settings:testDebugUnitTest

      - name: Assemble ARM TV APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Prepare APK package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tv-apks
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            tv-apks/Rinat-IPTV-TV-arm64-v8a-debug.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            tv-apks/Rinat-IPTV-TV-armeabi-v7a-debug.apk
          cd tv-apks
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload only installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: tv-box-debug-apks
          path: tv-apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
