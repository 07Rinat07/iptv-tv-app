name: Temporary EPG display-name format patch

on:
  push:
    branches:
      - fix/epg-display-name-alias-index-r1

permissions:
  contents: write

jobs:
  apply-format:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epg-display-name-alias-index-r1
          persist-credentials: true
      - name: Apply exact formatting fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          lines = path.read_text().splitlines()
          anchor = '            val displayNameChannelId = EpgDisplayNameMatchPolicy.uniqueChannelId('
          matches = [index for index, line in enumerate(lines) if line == anchor]
          if len(matches) != 1:
              raise SystemExit(f'expected matcher anchor exactly once, found {len(matches)}')

          index = matches[0]
          expected = [
              anchor,
              '            normalizedChannelName = normalizedName,',
              '            index = data.displayNameAliasIndex',
              '        )',
          ]
          if lines[index:index + 4] != expected:
              raise SystemExit('matcher block does not match the guarded pre-format source')

          lines[index:index + 4] = [
              anchor,
              '                normalizedChannelName = normalizedName,',
              '                index = data.displayNameAliasIndex',
              '            )',
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git diff -- core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git diff --cached --quiet && exit 1
          git commit -m 'style(epg): align display-name matcher wiring'
          git push origin HEAD:fix/epg-display-name-alias-index-r1
