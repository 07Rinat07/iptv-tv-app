name: Temporary EPG display-name format patch

on:
  push:
    branches:
      - fix/epg-display-name-alias-index-r1

permissions:
  contents: write

jobs:
  apply-format:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epg-display-name-alias-index-r1
          persist-credentials: true
      - name: Apply exact formatting fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt')
          text = path.read_text()
          old = '''            val displayNameChannelId = EpgDisplayNameMatchPolicy.uniqueChannelId(
                      normalizedChannelName = normalizedName,
                      index = data.displayNameAliasIndex
                  )
          '''
          new = '''            val displayNameChannelId = EpgDisplayNameMatchPolicy.uniqueChannelId(
                      normalizedChannelName = normalizedName,
                      index = data.displayNameAliasIndex
                  )
          '''
          # The exact source currently has the argument lines under-indented by four spaces.
          old = old.replace('                      normalizedChannelName', '            normalizedChannelName')
          old = old.replace('                      index', '            index')
          old = old.replace('                  )', '        )')
          if text.count(old) != 1:
              raise SystemExit(f'expected formatting target exactly once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/data/src/main/java/com/iptv/tv/core/data/repository/Repositories.kt
          git diff --cached --quiet && exit 1
          git commit -m 'style(epg): align display-name matcher wiring'
          git push origin HEAD:fix/epg-display-name-alias-index-r1
