name: Apply device acceptance fixes

on:
  push:
    branches:
      - fix/player-device-acceptance-blockers
    paths:
      - .automation/apply_device_fixes.py
      - .automation/device-fixes.part-*
      - .github/workflows/apply-device-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Apply verified patch
        run: python3 .automation/apply_device_fixes.py

      - name: Commit functional fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(player): resolve device acceptance blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
