name: Cleanup device fix automation

on:
  push:
    branches:
      - fix/player-device-acceptance-blockers
    paths:
      - .github/workflows/apply-device-fixes.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/apply_device_fixes.py
          rm -f .automation/device-fixes.part-*
          rm -f .github/workflows/apply-device-fixes.yml
          rmdir .automation 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove device fix applicator"
          git push origin "HEAD:${GITHUB_REF_NAME}"
