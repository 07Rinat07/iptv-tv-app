name: Temporary Player Guard Script Extractor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/guard-script-extractor.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/epg-ambiguous-partial-match
          fetch-depth: 0

      - name: Extract and harden existing guard script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/player-refactor-guard.yml')
          workflow = workflow_path.read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Verify exact checked-out revision\n"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('Expected one inline guard script block')
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          old_pattern = 'rf"(?:override\\s+)?(?:suspend\\s+)?fun\\s+{name}\\s*\\("'
          new_pattern = 'rf"(?:private\\s+)?(?:override\\s+)?(?:suspend\\s+)?fun\\s+{name}\\s*\\("'
          if script.count(old_pattern) != 2:
              raise SystemExit(f'Expected exactly two repository helper patterns, got {script.count(old_pattern)}')
          script = script.replace(old_pattern, new_pattern)

          marker = '''if scanner_mode is None or not scanner_mode.lstrip().startswith("enum class ScannerSearchMode"):\n    raise RuntimeError("declaration matching must ignore comments")\n\nMAIN = "app/src/main/java/com/iptv/tv/MainActivity.kt"\n'''
          replacement = '''if scanner_mode is None or not scanner_mode.lstrip().startswith("enum class ScannerSearchMode"):\n    raise RuntimeError("declaration matching must ignore comments")\n\nsynthetic_private_helper = (\n    "private fun parseChannelOverrides(raw: String): Map<Long, String> {\\n"\n    "  return emptyMap()\\n"\n    "}\\n"\n)\nprivate_helper = declaration_text(\n    synthetic_private_helper,\n    r"(?:private\\s+)?(?:override\\s+)?(?:suspend\\s+)?fun\\s+parseChannelOverrides\\s*\\(",\n)\nif private_helper is None or not private_helper.lstrip().startswith("private fun parseChannelOverrides"):\n    raise RuntimeError("private repository helpers must remain structurally matchable")\n\nMAIN = "app/src/main/java/com/iptv/tv/MainActivity.kt"\n'''
          if script.count(marker) != 1:
              raise SystemExit('Expected one synthetic declaration insertion point')
          script = script.replace(marker, replacement, 1)

          if script.count(new_pattern) != 2:
              raise SystemExit('Private-helper regex postcondition failed')
          if script.count('private repository helpers must remain structurally matchable') != 1:
              raise SystemExit('Private-helper regression postcondition failed')
          compile(script, '.github/scripts/player_refactor_guard.py', 'exec')

          output = Path('.github/scripts/player_refactor_guard.py')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(script)
          PY
          python3 -m py_compile .github/scripts/player_refactor_guard.py
          git diff --check
          test "$(git status --porcelain -- .github/scripts/player_refactor_guard.py | wc -l)" -eq 1

      - name: Commit extracted script
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/scripts/player_refactor_guard.py
          git diff --cached --check
          git commit -m "fix(ci): recognize private guarded repository helpers"
          git push origin HEAD:fix/epg-ambiguous-partial-match
