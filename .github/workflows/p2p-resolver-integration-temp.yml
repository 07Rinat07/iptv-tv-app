name: Temporary P2P resolver integration

on:
  push:
    branches:
      - feat/p2p-content-transport-resolver

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2p-content-transport-resolver
      - name: Apply resolver integration
        run: |
          python3 .github/tmp_p2p_resolver_patch.py
          rm .github/tmp_p2p_resolver_patch.py
          rm .github/workflows/p2p-resolver-integration-temp.yml
          git diff --check
          git config user.name "S.Rinat"
          git config user.email "102806560+07Rinat07@users.noreply.github.com"
          git add -A
          git commit -m "refactor(p2p): route content ids through transport resolver"
          git push origin HEAD:feat/p2p-content-transport-resolver
