<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Rinat IPTV — презентационный вид плеера</title>
  <desc id="desc">Темный TV-интерфейс: навигация слева, видео по центру, список каналов справа и быстрые карточки снизу.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02070d"/>
      <stop offset="0.58" stop-color="#06131e"/>
      <stop offset="1" stop-color="#02080d"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d59"/>
      <stop offset="0.55" stop-color="#0d2540"/>
      <stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12d8ff"/>
      <stop offset="1" stop-color="#00a8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1244" height="684" rx="24" fill="none" stroke="#123249" stroke-width="2"/>

  <!-- Left rail -->
  <rect x="34" y="48" width="190" height="610" rx="18" fill="#06111b" stroke="#123249"/>
  <circle cx="66" cy="82" r="18" fill="#0c2232" stroke="#12d8ff"/>
  <path d="M58 72h13c8 0 13 4 13 10s-5 10-13 10h-5l9 9" fill="none" stroke="#eaf8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="88" fill="#f3fbff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rinat IPTV</text>

  <rect x="48" y="125" width="162" height="48" rx="12" fill="#07283a" stroke="#12d8ff" stroke-width="2" filter="url(#glow)"/>
  <rect x="60" y="138" width="20" height="20" rx="4" fill="url(#cyan)"/>
  <text x="94" y="156" fill="#dffaff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Эфир</text>

  <g fill="#8ba9bc" font-family="Arial, sans-serif" font-size="17">
    <circle cx="70" cy="207" r="7" fill="#41657b"/><text x="94" y="213">Плейлисты</text>
    <circle cx="70" cy="253" r="7" fill="#41657b"/><text x="94" y="259">Группы</text>
    <circle cx="70" cy="299" r="7" fill="#41657b"/><text x="94" y="305">Избранное</text>
    <circle cx="70" cy="345" r="7" fill="#41657b"/><text x="94" y="351">Настройки</text>
  </g>
  <line x1="48" y1="389" x2="210" y2="389" stroke="#123249"/>
  <text x="58" y="430" fill="#55778d" font-family="Arial, sans-serif" font-size="14">TV • D-pad • Mouse</text>
  <text x="58" y="454" fill="#55778d" font-family="Arial, sans-serif" font-size="14">Media3 • LibVLC</text>
  <text x="58" y="478" fill="#55778d" font-family="Arial, sans-serif" font-size="14">IPTV • P2P</text>

  <!-- Main video area -->
  <text x="252" y="76" fill="#12d8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">LIVE</text>
  <text x="252" y="105" fill="#f3fbff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Channel 1</text>
  <text x="252" y="126" fill="#6f8fa4" font-family="Arial, sans-serif" font-size="14">Сейчас: программа канала • прямой эфир</text>

  <rect x="246" y="146" width="654" height="376" rx="16" fill="url(#video)" stroke="#123249" filter="url(#shadow)"/>
  <!-- stylized city/video frame -->
  <rect x="246" y="400" width="654" height="122" fill="#06101a" opacity="0.72"/>
  <path d="M250 401 C360 360 430 390 515 354 C610 315 710 350 898 310" fill="none" stroke="#1e6d92" stroke-width="4" opacity="0.8"/>
  <g stroke="#2d6f91" stroke-width="3" opacity="0.8">
    <line x1="355" y1="230" x2="355" y2="430"/><line x1="355" y1="230" x2="435" y2="294"/><line x1="355" y1="230" x2="295" y2="294"/>
    <line x1="770" y1="210" x2="770" y2="430"/><line x1="770" y1="210" x2="842" y2="284"/><line x1="770" y1="210" x2="700" y2="284"/>
  </g>
  <g fill="#17364a">
    <rect x="285" y="330" width="78" height="92"/><rect x="380" y="305" width="98" height="117"/><rect x="505" y="342" width="90" height="80"/>
    <rect x="620" y="298" width="110" height="124"/><rect x="750" y="350" width="104" height="72"/>
  </g>
  <g fill="#12d8ff" opacity="0.55">
    <rect x="302" y="351" width="8" height="5"/><rect x="324" y="364" width="8" height="5"/><rect x="401" y="330" width="8" height="5"/><rect x="439" y="346" width="8" height="5"/>
    <rect x="646" y="324" width="8" height="5"/><rect x="691" y="339" width="8" height="5"/><rect x="792" y="370" width="8" height="5"/>
  </g>
  <text x="272" y="454" fill="#f7fbff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Channel 1</text>
  <text x="272" y="478" fill="#8aa9ba" font-family="Arial, sans-serif" font-size="15">LIVE • Media3 / LibVLC fallback</text>

  <!-- Player controls -->
  <rect x="502" y="472" width="44" height="44" rx="22" fill="#06111b" stroke="#21475c"/>
  <path d="M520 484l15 10-15 10z" fill="#eaf8ff"/>
  <circle cx="574" cy="494" r="22" fill="#062235" stroke="#12d8ff" stroke-width="2"/>
  <rect x="568" y="485" width="5" height="18" rx="2" fill="#eaf8ff"/><rect x="578" y="485" width="5" height="18" rx="2" fill="#eaf8ff"/>
  <rect x="602" y="472" width="44" height="44" rx="22" fill="#06111b" stroke="#21475c"/>
  <path d="M615 484l15 10-15 10z" fill="#eaf8ff"/>

  <!-- Right channel list -->
  <rect x="920" y="48" width="326" height="474" rx="16" fill="#06111b" stroke="#123249"/>
  <text x="944" y="82" fill="#f3fbff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Каналы</text>
  <text x="1197" y="82" fill="#6f8fa4" font-family="Arial, sans-serif" font-size="14" text-anchor="end">12 доступно</text>
  <rect x="944" y="96" width="278" height="42" rx="9" fill="#071b29" stroke="#123249"/>
  <text x="960" y="123" fill="#55778d" font-family="Arial, sans-serif" font-size="14">Поиск канала</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="944" y="151" width="278" height="46" rx="10" fill="#07283a" stroke="#12d8ff" stroke-width="2"/>
    <circle cx="966" cy="174" r="7" fill="#12d8ff"/><text x="985" y="180" fill="#eafaff" font-weight="700">Channel 1</text><text x="1207" y="180" fill="#12d8ff" text-anchor="end">LIVE</text>
    <circle cx="966" cy="220" r="7" fill="#36586c"/><text x="985" y="226" fill="#abc0cd">Channel 2</text>
    <circle cx="966" cy="266" r="7" fill="#36586c"/><text x="985" y="272" fill="#abc0cd">Channel 3</text>
    <circle cx="966" cy="312" r="7" fill="#36586c"/><text x="985" y="318" fill="#abc0cd">Channel 4</text>
    <circle cx="966" cy="358" r="7" fill="#36586c"/><text x="985" y="364" fill="#abc0cd">Channel 5</text>
    <circle cx="966" cy="404" r="7" fill="#36586c"/><text x="985" y="410" fill="#abc0cd">Channel 6</text>
    <circle cx="966" cy="450" r="7" fill="#36586c"/><text x="985" y="456" fill="#abc0cd">Channel 7</text>
  </g>

  <!-- Bottom quick strip -->
  <text x="246" y="566" fill="#f3fbff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Каналы рядом</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <g transform="translate(246 584)"><rect width="112" height="78" rx="10" fill="#0a2333" stroke="#12d8ff" stroke-width="2"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#123d59"/><text x="10" y="69" fill="#eafaff">Channel 1</text></g>
    <g transform="translate(368 584)"><rect width="112" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 2</text></g>
    <g transform="translate(490 584)"><rect width="112" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 3</text></g>
    <g transform="translate(612 584)"><rect width="112" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 4</text></g>
    <g transform="translate(734 584)"><rect width="112" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 5</text></g>
    <g transform="translate(856 584)"><rect width="112" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 6</text></g>
    <g transform="translate(978 584)"><rect width="112" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="96" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 7</text></g>
    <g transform="translate(1100 584)"><rect width="122" height="78" rx="10" fill="#071722" stroke="#18384b"/><rect x="8" y="8" width="106" height="42" rx="6" fill="#17364a"/><text x="10" y="69" fill="#9bb3c1">Channel 8</text></g>
  </g>

  <text x="1220" y="690" fill="#31566c" font-family="Arial, sans-serif" font-size="12" text-anchor="end">Rinat IPTV • presentation preview</text>
</svg>
